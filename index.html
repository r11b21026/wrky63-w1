<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VMD 網頁分子動態播放器</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide 圖示庫 -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- NGL Viewer WebGL 渲染引擎 -->
  <script src="https://cdn.jsdelivr.net/npm/ngl@2.0.0-dev.37/dist/ngl.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');

    :root {
      --vmd-bg: #0b0f19;
      --vmd-panel: rgba(18, 24, 38, 0.92);
      --vmd-border: rgba(56, 189, 248, 0.28);
      --vmd-cyan: #38bdf8;
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--vmd-bg);
      color: #e2e8f0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      overflow: hidden;
    }

    .font-mono-vmd {
      font-family: 'JetBrains Mono', monospace;
    }

    .vmd-panel {
      background: var(--vmd-panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--vmd-border);
      box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.55);
    }

    input[type=range] {
      accent-color: #38bdf8;
    }

    input[type=range]::-webkit-slider-thumb {
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.85);
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.4);
      border-radius: 4px;
    }

    #axes-canvas {
      pointer-events: none;
    }
  </style>
</head>
<body class="w-screen h-screen relative bg-[#0b0f19]">

  <!-- 3D 渲染視窗 -->
  <div id="viewport" class="w-full h-full absolute inset-0 cursor-grab active:cursor-grabbing"></div>

  <!-- 讀取狀態遮罩 -->
  <div id="loading-overlay" class="absolute inset-0 z-50 bg-black/60 backdrop-blur-sm flex flex-col items-center justify-center transition-opacity duration-300 pointer-events-none">
    <div class="vmd-panel rounded-2xl p-6 flex flex-col items-center space-y-3 pointer-events-auto border border-cyan-500/40 shadow-2xl">
      <div class="w-10 h-10 border-4 border-cyan-500/30 border-t-cyan-400 rounded-full animate-spin"></div>
      <div class="font-mono-vmd text-sm text-cyan-300 font-bold tracking-wider" id="loading-text">掃描資料夾 PDB 結構中...</div>
      <div class="text-[12px] text-slate-400" id="loading-subtext">請稍候</div>
    </div>
  </div>

  <!-- 頂部資訊列與切換器 -->
  <header class="absolute top-3 left-3 right-3 sm:left-4 sm:right-4 z-20 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
    
    <!-- 左側：標題與結構選單 -->
    <div class="vmd-panel rounded-xl px-3 py-2 flex items-center space-x-2.5 pointer-events-auto shadow-lg max-w-full">
      <div class="flex items-center space-x-1.5 border-r border-slate-700/80 pr-2.5">
        <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></span>
        <span class="font-mono-vmd font-bold text-xs sm:text-sm tracking-wider text-cyan-400">VMD-WEB</span>
      </div>

      <!-- 檔案切換下拉選單 -->
      <div class="flex items-center space-x-1.5">
        <i data-lucide="file-text" class="w-3.5 h-3.5 text-cyan-400"></i>
        <select id="file-selector" class="bg-slate-900 border border-cyan-500/40 text-cyan-200 text-xs font-mono-vmd rounded-lg px-2.5 py-1 focus:outline-none focus:border-cyan-400 max-w-[170px] sm:max-w-[280px] truncate cursor-pointer hover:bg-slate-800 transition">
          <option value="" disabled selected>偵測 PDB 檔案中...</option>
        </select>
        <button id="btn-refresh-files" title="重新掃描資料夾" class="p-1 text-slate-400 hover:text-cyan-300 rounded hover:bg-slate-800 transition">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>

    <!-- 右側：HUD 數據面板與功能按鍵 -->
    <div class="flex items-center space-x-2 pointer-events-auto">
      
      <!-- 統計數據 -->
      <div class="vmd-panel hidden md:flex items-center space-x-3.5 px-3 py-2 rounded-xl font-mono-vmd text-xs text-slate-300">
        <div><span class="text-slate-500">原子數:</span> <span id="atom-count" class="text-slate-200">--</span></div>
        <div><span class="text-slate-500">影格 (Frame):</span> <span id="frame-counter" class="text-cyan-300 font-bold">0 / 0</span></div>
      </div>

      <!-- 渲染樣式選單 -->
      <button id="btn-toggle-rep" title="幾何樣式與配色" class="vmd-panel hover:bg-slate-800 text-cyan-400 hover:text-cyan-300 px-3 py-2 rounded-xl text-xs font-medium flex items-center space-x-1.5 transition">
        <i data-lucide="palette" class="w-4 h-4"></i>
        <span class="hidden sm:inline">樣式設定</span>
      </button>

      <!-- 本機上傳備用按鈕 -->
      <button id="btn-open-file" title="上傳電腦或手機本地 PDB" class="vmd-panel hover:bg-slate-800 text-cyan-400 hover:text-cyan-300 px-2.5 py-2 rounded-xl text-xs font-medium flex items-center space-x-1 transition">
        <i data-lucide="upload" class="w-4 h-4"></i>
        <span class="hidden sm:inline">上傳</span>
      </button>

      <!-- 重設視角 (r) -->
      <button id="btn-reset-view" title="重設鏡頭視角置中 (鍵盤 R)" class="vmd-panel hover:bg-slate-800 text-slate-300 hover:text-white px-2.5 py-2 rounded-xl text-xs transition">
        <i data-lucide="focus" class="w-4 h-4"></i>
      </button>
      
      <!-- 說明對話框 -->
      <button id="btn-info" title="手勢與操作說明" class="vmd-panel hover:bg-slate-800 text-slate-300 hover:text-white px-2.5 py-2 rounded-xl text-xs transition">
        <i data-lucide="help-circle" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- 左下角 VMD 座標三軸 -->
  <div class="absolute bottom-28 left-4 z-10 flex flex-col items-center pointer-events-none select-none">
    <canvas id="axes-canvas" width="86" height="86" class="drop-shadow-lg"></canvas>
    <span class="font-mono-vmd text-[10px] text-slate-400 font-bold tracking-widest mt-[-8px]">VMD 座標軸</span>
  </div>

  <!-- 幾何顯示與配色面板 -->
  <div id="rep-modal" class="hidden absolute top-16 right-4 z-30 w-80 max-w-[calc(100vw-2rem)] vmd-panel rounded-2xl p-4 shadow-2xl transition-all">
    <div class="flex items-center justify-between pb-3 border-b border-slate-700/60 mb-3">
      <div class="flex items-center space-x-2">
        <i data-lucide="layers" class="w-4 h-4 text-cyan-400"></i>
        <h3 class="text-sm font-semibold text-slate-100">分子繪製樣式 (Representations)</h3>
      </div>
      <button id="btn-close-rep" class="text-slate-400 hover:text-white">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- 繪製樣式 -->
    <div class="mb-4">
      <label class="block text-xs font-mono-vmd text-slate-400 mb-1.5 uppercase tracking-wide">Drawing Method (繪圖模式)</label>
      <div class="grid grid-cols-2 gap-1.5">
        <button class="rep-style-btn px-2.5 py-1.5 rounded-lg text-xs font-medium text-left border border-cyan-500/40 bg-cyan-500/15 text-cyan-300" data-rep="cartoon">NewCartoon 卡通</button>
        <button class="rep-style-btn px-2.5 py-1.5 rounded-lg text-xs font-medium text-left border border-slate-700 bg-slate-800/50 text-slate-300 hover:border-slate-600" data-rep="licorice">Licorice 管狀</button>
        <button class="rep-style-btn px-2.5 py-1.5 rounded-lg text-xs font-medium text-left border border-slate-700 bg-slate-800/50 text-slate-300 hover:border-slate-600" data-rep="surface">QuickSurf 表面</button>
        <button class="rep-style-btn px-2.5 py-1.5 rounded-lg text-xs font-medium text-left border border-slate-700 bg-slate-800/50 text-slate-300 hover:border-slate-600" data-rep="spacefill">VDW 凡德瓦球體</button>
        <button class="rep-style-btn px-2.5 py-1.5 rounded-lg text-xs font-medium text-left border border-slate-700 bg-slate-800/50 text-slate-300 hover:border-slate-600" data-rep="ribbon">Ribbon 絲帶</button>
        <button class="rep-style-btn px-2.5 py-1.5 rounded-lg text-xs font-medium text-left border border-slate-700 bg-slate-800/50 text-slate-300 hover:border-slate-600" data-rep="trace">Trace 軌跡線</button>
      </div>
    </div>

    <!-- 配色方案 -->
    <div class="mb-3">
      <label class="block text-xs font-mono-vmd text-slate-400 mb-1.5 uppercase tracking-wide">Coloring Method (著色規則)</label>
      <select id="color-select" class="w-full bg-slate-900 border border-slate
