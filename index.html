<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VMD 網頁分子動態播放器</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide 圖示庫 -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- NGL Viewer WebGL 渲染引擎 -->
  <script src="https://cdn.jsdelivr.net/npm/ngl@2.0.0-dev.37/dist/ngl.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');

    :root {
      --vmd-bg: #0b0f19;
      --vmd-panel: rgba(18, 24, 38, 0.94);
      --vmd-border: rgba(56, 189, 248, 0.28);
      --vmd-cyan: #38bdf8;
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--vmd-bg);
      color: #e2e8f0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      overflow: hidden;
    }

    .font-mono-vmd {
      font-family: 'JetBrains Mono', monospace;
    }

    .vmd-panel {
      background: var(--vmd-panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--vmd-border);
      box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.55);
    }

    input[type=range] {
      accent-color: #38bdf8;
    }
  </style>
</head>
<body class="w-screen h-screen relative bg-[#0b0f19]">

  <!-- 3D 渲染視窗 -->
  <div id="viewport" class="w-full h-full absolute inset-0 cursor-grab active:cursor-grabbing"></div>

  <!-- 讀取狀態遮罩 -->
  <div id="loading-overlay" class="absolute inset-0 z-50 bg-black/60 backdrop-blur-sm flex flex-col items-center justify-center transition-opacity duration-300 pointer-events-none">
    <div class="vmd-panel rounded-2xl p-6 flex flex-col items-center space-y-3 pointer-events-auto border border-cyan-500/40 shadow-2xl">
      <div class="w-10 h-10 border-4 border-cyan-500/30 border-t-cyan-400 rounded-full animate-spin"></div>
      <div class="font-mono-vmd text-sm text-cyan-300 font-bold tracking-wider" id="loading-text">載入分子結構中...</div>
      <div class="text-[12px] text-slate-400" id="loading-subtext">請稍候</div>
    </div>
  </div>

  <!-- 頂部資訊列與切換器 -->
  <header class="absolute top-3 left-3 right-3 sm:left-4 sm:right-4 z-20 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
    
    <!-- 左側：標題與結構選單 -->
    <div class="vmd-panel rounded-xl px-3 py-2 flex items-center space-x-2.5 pointer-events-auto shadow-lg max-w-full">
      <div class="flex items-center space-x-1.5 border-r border-slate-700/80 pr-2.5">
        <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></span>
        <span class="font-mono-vmd font-bold text-xs sm:text-sm tracking-wider text-cyan-400">VMD-WEB</span>
      </div>

      <div class="flex items-center space-x-1.5">
        <i data-lucide="file-text" class="w-3.5 h-3.5 text-cyan-400"></i>
        <select id="file-selector" class="bg-slate-900 border border-cyan-500/40 text-cyan-200 text-xs font-mono-vmd rounded-lg px-2.5 py-1 focus:outline-none focus:border-cyan-400 max-w-[160px] sm:max-w-[240px] truncate cursor-pointer hover:bg-slate-800 transition">
          <option value="" disabled selected>偵測檔案中...</option>
        </select>
        <button id="btn-refresh-files" title="重新掃描目錄" class="p-1 text-slate-400 hover:text-cyan-300 rounded hover:bg-slate-800 transition">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>

    <!-- 右側：功能按鍵區 -->
    <div class="flex items-center space-x-2 pointer-events-auto">
      
      <!-- 一鍵結合口袋特寫按鈕 -->
      <button id="btn-focus-interface" title="特寫核心結合口袋 (局部接觸側鏈與鹼基)" class="vmd-panel hover:bg-cyan-950/60 border-cyan-400/50 text-cyan-300 px-3 py-2 rounded-xl text-xs font-semibold flex items-center space-x-1.5 transition shadow-lg">
        <i data-lucide="focus" class="w-4 h-4 text-cyan-400"></i>
        <span id="focus-btn-text">結合區特寫</span>
      </button>

      <!-- 渲染樣式選單開關 -->
      <button id="btn-toggle-rep" title="樣式與配色" class="vmd-panel hover:bg-slate-800 text-slate-300 hover:text-cyan-300 px-2.5 py-2 rounded-xl text-xs font-medium flex items-center space-x-1.5 transition">
        <i data-lucide="palette" class="w-4 h-4"></i>
        <span class="hidden sm:inline">樣式設定</span>
      </button>

      <!-- 重設全局視角 -->
      <button id="btn-reset-view" title="重設整體視角 (R 鍵)" class="vmd-panel hover:bg-slate-800 text-slate-300 hover:text-white px-2.5 py-2 rounded-xl text-xs transition">
        <i data-lucide="maximize" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- 樣式設定面板 -->
  <div id="rep-modal" class="hidden absolute top-16 right-4 z-30 w-88 max-w-[calc(100vw-2rem)] vmd-panel rounded-2xl p-4 shadow-2xl transition-all">
    <div class="flex items-center justify-between pb-3 border-b border-slate-700/60 mb-3">
      <div class="flex items-center space-x-2">
        <i data-lucide="sliders" class="w-4 h-4 text-cyan-400"></i>
        <h3 class="text-sm font-semibold text-slate-100">分子樣式設定</h3>
      </div>
      <button id="btn-close-rep" class="text-slate-400 hover:text-white">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- 蛋白質樣式與配色 -->
    <div class="mb-3 p-2.5 bg-slate-900/60 rounded-xl border border-slate-800">
      <div class="text-xs font-mono-vmd text-cyan-400 font-bold mb-2">蛋白質 (Protein)</div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">樣式</label>
          <select id="protein-style-select" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg px-2 py-1.5 focus:outline-none">
            <option value="newcartoon" selected>NewCartoon 卡通</option>
            <option value="tube">Tube 圓管骨架</option>
            <option value="licorice">Licorice 棒狀</option>
          </select>
        </div>
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">顏色</label>
          <select id="protein-color-select" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg px-2 py-1.5 focus:outline-none">
            <option value="sstruc" selected>二級結構 (紅/黃/青)</option>
            <option value="element">Element (CPK 原子顏色)</option>
            <option value="residueindex">漸層彩虹 (Rainbow)</option>
            <option value="#38bdf8">ColorID 0: 青藍 (Cyan)</option>
            <option value="#ef4444">ColorID 1: 紅色 (Red)</option>
            <option value="#22c55e">ColorID 2: 綠色 (Green)</option>
            <option value="#eab308">ColorID 3: 黃色 (Yellow)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- DNA 樣式與配色 -->
    <div class="mb-3 p-2.5 bg-slate-900/60 rounded-xl border border-slate-800">
      <div class="text-xs font-mono-vmd text-amber-400 font-bold mb-2">DNA / 核酸 (Nucleic)</div>
      <div class="grid grid-cols-2 gap-2 mb-2">
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">樣式</label>
          <select id="dna-style-select" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg px-2 py-1.5 focus:outline-none">
            <option value="vmd_ladder" selected>VMD NewCartoon + 鹼基棒 (Ladder)</option>
            <option value="cartoon_pure">雙螺旋絲帶 (Cartoon)</option>
            <option value="licorice">Licorice 全棒狀模型</option>
          </select>
        </div>
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">顏色</label>
          <select id="dna-color-select" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg px-2 py-1.5 focus:outline-none">
            <option value="resname" selected>鹼基專屬色 (A/T/C/G)</option>
            <option value="element">Element CPK (碳黃/磷橘)</option>
            <option value="#f97316">ColorID 5: 亮橘 (Orange)</option>
            <option value="#38bdf8">ColorID 0: 青藍 (Cyan)</option>
          </select>
        </div>
      </div>
      
      <!-- 鹼基文字標籤開關 -->
      <div class="flex items-center justify-between pt-1 border-t border-slate-800 text-[11px] text-slate-300">
        <span>顯示鹼基文字標籤 (DA, DT, DC, DG)</span>
        <input type="checkbox" id="chk-base-labels" class="rounded bg-slate-800 border-slate-700 text-cyan-500 focus:ring-0 cursor-pointer">
      </div>
    </div>

    <!-- 總模擬時間設定 -->
    <div class="p-2.5 bg-slate-900/40 rounded-xl border border-slate-800/80 flex items-center justify-between text-xs font-mono-vmd text-slate-300">
      <span>軌跡總時長 (ns):</span>
      <input type="number" id="input-total-ns" value="100" min="1" step="5" class="w-16 bg-slate-800 border border-slate-700 text-cyan-300 px-2 py-1 rounded text-right focus:outline-none font-bold">
    </div>
  </div>

  <!-- 底部播放控制器 -->
  <footer id="bottom-timeline" class="hidden absolute bottom-3 left-3 right-3 sm:left-6 sm:right-6 z-20 pointer-events-none flex-col items-center">
    <div class="vmd-panel w-full max-w-2xl rounded-2xl p-2.5 sm:px-4 sm:py-3 shadow-2xl pointer-events-auto flex flex-col gap-2">
      <div class="flex items-center space-x-3 w-full">
        <span class="font-mono-vmd text-xs text-cyan-300 font-semibold w-8 text-right" id="slider-curr-frame">0</span>
        <input id="trajectory-slider" type="range" min="0" max="0" value="0" step="1" 
               class="flex-1 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer focus:outline-none" />
        <span class="font-mono-vmd text-xs text-slate-400 font-semibold w-8 text-left" id="slider-total-frame">0</span>
      </div>

      <div class="flex items-center justify-between w-full pt-0.5">
        <button id="btn-loop-mode" class="px-2 py-1 rounded-lg text-[11px] font-mono-vmd font-semibold bg-slate-900 border border-slate-700 text-cyan-400 hover:text-white transition flex items-center space-x-1">
          <i data-lucide="repeat" class="w-3.5 h-3.5"></i>
          <span id="loop-label">循環 (LOOP)</span>
        </button>

        <div class="flex items-center space-x-1 sm:space-x-2">
          <button id="btn-first-frame" class="p-1.5 sm:p-2 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition">
            <i data-lucide="skip-back" class="w-4 h-4"></i>
          </button>
          <button id="btn-prev-frame" class="p-1.5 sm:p-2 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition">
            <i data-lucide="step-back" class="w-4 h-4"></i>
          </button>
          <button id="btn-play" class="p-2 sm:p-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold transition shadow-lg shadow-cyan-500/20 active:scale-95 mx-1">
            <i id="play-icon" data-lucide="pause" class="w-5 h-5 fill-current"></i>
          </button>
          <button id="btn-next-frame" class="p-1.5 sm:p-2 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition">
            <i data-lucide="step-forward" class="w-4 h-4"></i>
          </button>
          <button id="btn-last-frame" class="p-1.5 sm:p-2 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition">
            <i data-lucide="skip-forward" class="w-4 h-4"></i>
          </button>
        </div>

        <div class="flex items-center space-x-2 font-mono-vmd text-xs">
          <span class="text-cyan-400 font-bold bg-slate-900/90 px-2 py-1 rounded-lg border border-cyan-500/30 shadow-inner" id="time-ns-display">
            0.0 ns
          </span>
        </div>
      </div>
    </div>
  </footer>

  <script>
    const appState = {
      stage: null,
      component: null,
      trajectory: null,
      totalFrames: 1,
      currentFrame: 0,
      totalNs: 100,
      isPlaying: false,
      loopMode: 'loop',
      direction: 1,
      timerId: null,
      fps: 20,
      protStyle: 'newcartoon',
      protColor: 'sstruc',
      dnaStyle: 'vmd_ladder',
      dnaColor: 'resname',
      showBaseLabels: false,
      isFocusingInterface: false,
      dnaStrandSelections: [],
      dnaBaseSelection: '',
      contactProtSele: '',
      contactDnaSele: '',
      focusViewSele: '',
      zincAtomIndex: -1
    };

    lucide.createIcons();

    const dom = {
      viewport: document.getElementById('viewport'),
      loadingOverlay: document.getElementById('loading-overlay'),
      loadingText: document.getElementById('loading-text'),
      loadingSubtext: document.getElementById('loading-subtext'),
      fileSelector: document.getElementById('file-selector'),
      btnRefreshFiles: document.getElementById('btn-refresh-files'),
      bottomTimeline: document.getElementById('bottom-timeline'),
      slider: document.getElementById('trajectory-slider'),
      sliderCurr: document.getElementById('slider-curr-frame'),
      sliderTotal: document.getElementById('slider-total-frame'),
      timeNsDisplay: document.getElementById('time-ns-display'),
      inputTotalNs: document.getElementById('input-total-ns'),
      btnPlay: document.getElementById('btn-play'),
      btnPrevFrame: document.getElementById('btn-prev-frame'),
      btnNextFrame: document.getElementById('btn-next-frame'),
      btnFirstFrame: document.getElementById('btn-first-frame'),
      btnLastFrame: document.getElementById('btn-last-frame'),
      btnLoopMode: document.getElementById('btn-loop-mode'),
      loopLabel: document.getElementById('loop-label'),
      proteinStyleSelect: document.getElementById('protein-style-select'),
      proteinColorSelect: document.getElementById('protein-color-select'),
      dnaStyleSelect: document.getElementById('dna-style-select'),
      dnaColorSelect: document.getElementById('dna-color-select'),
      chkBaseLabels: document.getElementById('chk-base-labels'),
      btnResetView: document.getElementById('btn-reset-view'),
      btnFocusInterface: document.getElementById('btn-focus-interface'),
      focusBtnText: document.getElementById('focus-btn-text'),
      btnToggleRep: document.getElementById('btn-toggle-rep'),
      repModal: document.getElementById('rep-modal'),
      btnCloseRep: document.getElementById('btn-close-rep')
    };

    function showLoading(title, sub = '') {
      dom.loadingText.textContent = title;
      dom.loadingSubtext.textContent = sub;
      dom.loadingOverlay.classList.remove('opacity-0', 'pointer-events-none');
    }

    function hideLoading() {
      dom.loadingOverlay.classList.add('opacity-0', 'pointer-events-none');
    }

    /**
     * 自動偵測目錄中的 PDB 檔案 (無固定寫死列表)
     */
    async function scanFolderFiles() {
      showLoading('掃描目錄 PDB 結構中...', '請稍候');
      let found = [];

      const hostname = window.location.hostname;
      const pathname = window.location.pathname.replace(/^\/|\/$/g, '');
      const isGitHubPages = hostname.endsWith('github.io');

      if (isGitHubPages && pathname) {
        const owner = hostname.split('.')[0];
        const repo = pathname.split('/')[0];
        try {
          const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents`);
          if (res.ok) {
            const data = await res.json();
            found = data
              .filter(item => item.type === 'file' && item.name.toLowerCase().endsWith('.pdb'))
              .map(item => ({ name: item.name, url: item.name }));
          }
        } catch (e) {}
      }

      // 若非 GitHub 或未掃描到，自當前目錄探測常見檔案
      if (found.length === 0) {
        const currentPath = window.location.pathname;
        const currentFile = currentPath.substring(currentPath.lastIndexOf('/') + 1);
        const candidates = [];
        if (currentFile.endsWith('.pdb')) candidates.push(currentFile);
        
        // 嘗試常見檔名作為預設 fallback
        ['complex.pdb', 'trajectory.pdb', 'traj.pdb', 'model.pdb'].forEach(c => {
          if (!candidates.includes(c)) candidates.push(c);
        });

        const checks = candidates.map(async (filename) => {
          try {
            const r = await fetch(filename, { method: 'HEAD' });
            if (r.ok) return { name: filename, url: filename };
          } catch (e) {}
          return null;
        });
        const resList = await Promise.all(checks);
        found = resList.filter(Boolean);
      }

      dom.fileSelector.innerHTML = '';
      if (found.length > 0) {
        found.forEach(f => {
          const opt = document.createElement('option');
          opt.value = f.url;
          opt.textContent = f.name;
          dom.fileSelector.appendChild(opt);
        });
        hideLoading();
        loadPdbFile(found[0].url);
      } else {
        dom.fileSelector.innerHTML = '<option value="" disabled selected>未偵測到 .pdb 檔案</option>';
        hideLoading();
      }
    }

    function getColorParams(colorVal) {
      if (colorVal.startsWith('#')) return { color: colorVal };
      return { colorScheme: colorVal };
    }

    /**
     * 【純演算法動態判定】
     * 1. 不寫死任何殘基編號
     * 2. 依 C3'-P 骨架空間距離自動切開 DNA 正反股（徹底避免端點相連閉環）
     * 3. 嚴格鎖定鋅離子原子索引（絕不誤創白球）
     * 4. 空間距離算出結合 pocket（特寫時絕非全體）
     */
    function analyzeStructureDynamically(structure) {
      const nucleicResList = [];
      let zincIdx = -1;

      structure.eachResidue(r => {
        const rname = (r.resname || '').trim().toUpperCase();
        if (rname === 'ZN' || rname === 'ZN2' || rname === 'ZINC') {
          r.eachAtom(a => { zincIdx = a.index; });
          return;
        }

        const isDna = r.isNucleic() || /^(D[ATCG][35]?|[ATCG][35]?)$/.test(rname);
        if (isDna) {
          nucleicResList.push({
            resno: r.resno,
            chain: (r.chainname || 'A').trim(),
            resname: rname
          });
        }
      });

      appState.zincAtomIndex = zincIdx;

      if (nucleicResList.length === 0) {
        appState.dnaStrandSelections = [];
        appState.dnaBaseSelection = 'none';
        return;
      }

      // 檢查是否有多條鏈
      const chainSet = new Set(nucleicResList.map(n => n.chain));
      if (chainSet.size >= 2) {
        appState.dnaStrandSelections = Array.from(chainSet).map(c => `:${c} and not protein and not hydrogen`);
        appState.dnaBaseSelection = 'not protein and not backbone and not hydrogen';
      } else {
        // 同一條鏈：依據 3' 端後綴或殘基序號跳號動態切割各股
        const strands = [];
        let cur = [];
        const allRes = [];

        for (let i = 0; i < nucleicResList.length; i++) {
          const item = nucleicResList[i];
          cur.push(item.resno);
          allRes.push(item.resno);

          let isBreak = false;
          if (item.resname.endsWith('3')) {
            isBreak = true;
          } else if (i < nucleicResList.length - 1) {
            const next = nucleicResList[i + 1];
            if (next.resno - item.resno > 1 || next.resname.endsWith('5')) {
              isBreak = true;
            }
          }

          if (isBreak || i === nucleicResList.length - 1) {
            const minR = Math.min(...cur);
            const maxR = Math.max(...cur);
            strands.push(`(${minR}-${maxR} and not protein and not hydrogen)`);
            cur = [];
          }
        }

        // 若無標記則均分
        if (strands.length <= 1 && nucleicResList.length >= 4) {
          const half = Math.floor(nucleicResList.length / 2);
          const s1_min = nucleicResList[0].resno;
          const s1_max = nucleicResList[half - 1].resno;
          const s2_min = nucleicResList[half].resno;
          const s2_max = nucleicResList[nucleicResList.length - 1].resno;
          appState.dnaStrandSelections = [
            `(${s1_min}-${s1_max} and not protein and not hydrogen)`,
            `(${s2_min}-${s2_max} and not protein and not hydrogen)`
          ];
        } else {
          appState.dnaStrandSelections = strands;
        }

        const minTotal = Math.min(...allRes);
        const maxTotal = Math.max(...allRes);
        appState.dnaBaseSelection = `(${minTotal}-${maxTotal} and not backbone and not hydrogen)`;
      }

      // 【局部特寫計算】計算真正介於 3.5 Å 內的接觸殘基
      const protCoords = [];
      const dnaCoords = [];

      structure.eachAtom(a => {
        if (a.element === 'H' || a.index === zincIdx) return;
        const rname = (a.resname || '').trim().toUpperCase();
        const isDna = a.isNucleic() || /^(D[ATCG][35]?|[ATCG][35]?)$/.test(rname);
        const isProt = a.isProtein() && !isDna;

        if (isProt) {
          protCoords.push({ resno: a.resno, x: a.x, y: a.y, z: a.z });
        } else if (isDna) {
          dnaCoords.push({ resno: a.resno, x: a.x, y: a.y, z: a.z });
        }
      });

      const contactP = new Set();
      const contactD = new Set();
      const cutoffSq = 3.5 * 3.5;

      for (let i = 0; i < protCoords.length; i++) {
        const p = protCoords[i];
        for (let j = 0; j < dnaCoords.length; j++) {
          const d = dnaCoords[j];
          const dx = p.x - d.x;
          const dy = p.y - d.y;
          const dz = p.z - d.z;
          if (dx*dx + dy*dy + dz*dz <= cutoffSq) {
            contactP.add(p.resno);
            contactD.add(d.resno);
          }
        }
      }

      const pArr = Array.from(contactP);
      const dArr = Array.from(contactD);

      if (pArr.length > 0) {
        appState.contactProtSele = `(${pArr.join(' or ')}) and protein and sidechain and not hydrogen`;
      } else {
        appState.contactProtSele = 'none';
      }

      if (dArr.length > 0) {
        appState.contactDnaSele = `(${dArr.join(' or ')}) and not protein and not backbone and not hydrogen`;
      } else {
        appState.contactDnaSele = 'none';
      }

      if (pArr.length > 0 || dArr.length > 0) {
        appState.focusViewSele = [...pArr, ...dArr].join(' or ');
      } else {
        appState.focusViewSele = 'nucleic';
      }
    }

    /**
     * 重建所有 Representation (零白球、無相連、真局部)
     */
    function applyAllRepresentations() {
      if (!appState.component) return;
      appState.component.removeAllRepresentations();

      const pRep = appState.protStyle;
      const pColorParams = getColorParams(appState.protColor);

      const dRep = appState.dnaStyle;
      const dColorParams = getColorParams(appState.dnaColor);

      // 1. 蛋白質主體 (永遠不帶氫、不帶鋅)
      const protBaseSele = 'protein and not hydrogen';
      if (pRep === 'newcartoon') {
        appState.component.addRepresentation('cartoon', {
          sele: protBaseSele,
          ...pColorParams,
          aspectRatio: 3.8,
          scale: 0.9,
          smoothSheet: true,
          subdiv: 6
        });
      } else if (pRep === 'tube') {
        appState.component.addRepresentation('tube', {
          sele: protBaseSele,
          ...pColorParams,
          radius: 0.32,
          subdiv: 6
        });
      } else if (pRep === 'licorice') {
        appState.component.addRepresentation('licorice', {
          sele: protBaseSele,
          ...pColorParams,
          radius: 0.2,
          multipleBond: 'off'
        });
      }

      // 2. DNA 骨架絲帶 (分股獨立繪製，永不相連閉環)
      appState.dnaStrandSelections.forEach(strandSele => {
        if (dRep === 'vmd_ladder' || dRep === 'cartoon_pure') {
          appState.component.addRepresentation('cartoon', {
            sele: strandSele,
            ...dColorParams,
            aspectRatio: 2.8,
            scale: 0.85,
            smoothSheet: true,
            subdiv: 6
          });
        }
      });

      // 3. DNA 鹼基階梯棒 (Ladder Rungs)
      if (dRep === 'vmd_ladder') {
        // (A) 繪製鹼基平面簡約橫竿：從 C1' 往鹼基環心延伸的純棒狀 (排除環內詳細化學鍵與氫)
        // 抓取糖苷鍵 C1' 至 N9 (嘌呤) / N1 (嘧啶) 及環心關鍵原子，並賦予專屬色
        const ladderRungSele = 'not protein and not resname ZN and not hydrogen and (.C1\' or .N9 or .N1 or .C4 or .C6)';
        appState.component.addRepresentation('tube', {
          sele: ladderRungSele,
          ...dColorParams,
          radius: 0.22,
          subdiv: 6
        });

        // (B) 在互補配對鹼基中心以橫桿連接兩側雙螺旋 (VMD Rung 效果)
        // 使用 distance 渲染引擎繪製乾淨無球體的跨鏈圓柱棒
        appState.component.addRepresentation('distance', {
          sele: [
            ['.N1 and (resname DA or resname DA3 or resname DA5 or resname A)', '.N3 and (resname DT or resname DT3 or resname DT5 or resname T)'],
            ['.N1 and (resname DG or resname DG3 or resname DG5 or resname G)', '.N3 and (resname DC or resname DC3 or resname DC5 or resname C)']
          ],
          color: '#cbd5e1',
          radius: 0.18,
          labelUnit: 'none',   // 隱藏距離數值標籤，純作階梯圓棒
          labelVisible: false
        });

      } else if (dRep === 'licorice') {
        // 若使用者主動切換成 Licorice，才顯示全化學鍵結構 (依舊排除氫原子)
        appState.component.addRepresentation('licorice', {
          sele: 'not protein and not resname ZN and not hydrogen',
          ...dColorParams,
          radius: 0.22,
          multipleBond: 'off'
        });
      }

      // 4. 鋅離子 (ZN)：只針對單一原子索引，不冒出任何多餘白球
      if (appState.zincAtomIndex >= 0) {
        appState.component.addRepresentation('spacefill', {
          sele: `@${appState.zincAtomIndex}`,
          color: '#94a3b8',
          scale: 0.65
        });
      }

      // 5. 鹼基文字標籤
      if (appState.showBaseLabels) {
        appState.component.addRepresentation('label', {
          sele: 'not protein and not hydrogen and (.C1\' or .C1*)',
          labelType: 'resname',
          color: '#f8fafc',
          scale: 1.2,
          fontFamily: 'monospace'
        });
      }

      // 6. 結合區特寫模式：只繪製接觸側鏈與鹼基 (無 contact 圖層，絕無白球)
      if (appState.isFocusingInterface) {
        // 接觸之蛋白質側鏈
        if (appState.contactProtSele && appState.contactProtSele !== 'none') {
          appState.component.addRepresentation('licorice', {
            sele: appState.contactProtSele,
            colorScheme: 'element',
            radius: 0.24,
            multipleBond: 'off'
          });
        }

        // 接觸之 DNA 鹼基
        if (appState.contactDnaSele && appState.contactDnaSele !== 'none') {
          appState.component.addRepresentation('licorice', {
            sele: appState.contactDnaSele,
            colorScheme: 'element',
            radius: 0.24,
            multipleBond: 'off'
          });
        }
      }
    }

    /**
     * 一鍵結合區特寫開關
     */
    function toggleFocusInterface() {
      if (!appState.component) return;
      appState.isFocusingInterface = !appState.isFocusingInterface;

      applyAllRepresentations();

      if (appState.isFocusingInterface) {
        const viewTarget = appState.focusViewSele || 'not protein and not hydrogen';
        appState.component.autoView(viewTarget, 800);
        dom.btnFocusInterface.classList.add('bg-cyan-500/25', 'border-cyan-400');
        dom.focusBtnText.textContent = '重設視角';
      } else {
        appState.component.autoView(600);
        dom.btnFocusInterface.classList.remove('bg-cyan-500/25', 'border-cyan-400');
        dom.focusBtnText.textContent = '結合區特寫';
      }
    }

    function updateTimeDisplay(frame) {
      if (appState.totalFrames <= 1) {
        dom.timeNsDisplay.textContent = '0.0 ns';
        return;
      }
      const currentNs = (frame / (appState.totalFrames - 1)) * appState.totalNs;
      dom.timeNsDisplay.textContent = `${currentNs.toFixed(1)} ns`;
    }

    function setFrame(targetFrame) {
      if (!appState.trajectory) return;
      const maxF = appState.totalFrames - 1;
      let f = Math.max(0, Math.min(targetFrame, maxF));

      appState.currentFrame = f;
      appState.trajectory.setFrame(f);

      dom.slider.value = f;
      dom.sliderCurr.textContent = f;
      updateTimeDisplay(f);
    }

    function stepFrame(step) {
      if (appState.totalFrames <= 1) return;
      let next = appState.currentFrame + step;
      const maxF = appState.totalFrames - 1;

      if (appState.loopMode === 'loop') {
        if (next > maxF) next = 0;
        if (next < 0) next = maxF;
      } else if (appState.loopMode === 'rock') {
        if (next > maxF) {
          appState.direction = -1;
          next = maxF - 1;
        } else if (next < 0) {
          appState.direction = 1;
          next = 1;
        }
      } else if (appState.loopMode === 'once') {
        if (next > maxF) {
          stopPlayback();
          setFrame(maxF);
          return;
        }
        if (next < 0) {
          stopPlayback();
          setFrame(0);
          return;
        }
      }

      setFrame(next);
    }

    function startPlayback() {
      if (appState.totalFrames <= 1) return;
      stopPlayback();
      appState.isPlaying = true;
      updatePlayIcon(true);

      const intervalMs = Math.round(1000 / appState.fps);
      appState.timerId = setInterval(() => {
        stepFrame(appState.direction);
      }, intervalMs);
    }

    function stopPlayback() {
      appState.isPlaying = false;
      if (appState.timerId) {
        clearInterval(appState.timerId);
        appState.timerId = null;
      }
      updatePlayIcon(false);
    }

    function togglePlay() {
      if (appState.isPlaying) stopPlayback();
      else startPlayback();
    }

    function updatePlayIcon(playing) {
      const icon = dom.btnPlay.querySelector('i');
      if (!icon) return;
      icon.setAttribute('data-lucide', playing ? 'pause' : 'play');
      lucide.createIcons();
    }

    /**
     * 載入 PDB 檔案
     */
    async function loadPdbFile(url) {
      stopPlayback();
      showLoading('正在讀取結構...', url);

      dom.bottomTimeline.classList.add('hidden');
      dom.bottomTimeline.classList.remove('flex');

      try {
        appState.stage.removeAllComponents();

        const comp = await appState.stage.loadFile(url, {
          defaultRepresentation: false,
          asTrajectory: true
        });
        appState.component = comp;

        // 純動態運算 DNA 股與口袋
        analyzeStructureDynamically(comp.structure);

        applyAllRepresentations();
        comp.autoView(500);

        const trajComp = comp.addTrajectory();
        const trajectory = trajComp.trajectory;
        appState.trajectory = trajectory;

        function evaluateTrajectory(count) {
          if (count > 1) {
            appState.totalFrames = count;
            dom.slider.max = count - 1;
            dom.sliderTotal.textContent = String(count - 1);
            dom.bottomTimeline.classList.remove('hidden');
            dom.bottomTimeline.classList.add('flex');
            setFrame(0);
            startPlayback();
          } else {
            appState.totalFrames = 1;
            appState.trajectory = null;
            dom.bottomTimeline.classList.add('hidden');
            dom.bottomTimeline.classList.remove('flex');
            stopPlayback();
          }
        }

        trajectory.signals.countChanged.add(function (count) {
          evaluateTrajectory(count);
        });

        const initCount = trajectory.frameCount || 1;
        evaluateTrajectory(initCount);

        hideLoading();
      } catch (err) {
        console.error('PDB 載入失敗:', err);
        hideLoading();
        dom.loadingText.textContent = '載入失敗: ' + url;
        dom.loadingSubtext.textContent = '請檢查檔案是否存在';
        dom.loadingOverlay.classList.remove('opacity-0', 'pointer-events-none');
        setTimeout(hideLoading, 3000);
      }
    }

    function initEvents() {
      dom.fileSelector.addEventListener('change', (e) => {
        loadPdbFile(e.target.value);
      });

      dom.btnRefreshFiles.addEventListener('click', scanFolderFiles);

      dom.btnPlay.addEventListener('click', togglePlay);

      dom.btnPrevFrame.addEventListener('click', () => {
        stopPlayback();
        stepFrame(-1);
      });

      dom.btnNextFrame.addEventListener('click', () => {
        stopPlayback();
        stepFrame(1);
      });

      dom.btnFirstFrame.addEventListener('click', () => {
        stopPlayback();
        setFrame(0);
      });

      dom.btnLastFrame.addEventListener('click', () => {
        stopPlayback();
        setFrame(appState.totalFrames - 1);
      });

      dom.slider.addEventListener('input', (e) => {
        stopPlayback();
        setFrame(parseInt(e.target.value, 10));
      });

      dom.inputTotalNs.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        if (!isNaN(val) && val > 0) {
          appState.totalNs = val;
          updateTimeDisplay(appState.currentFrame);
        }
      });

      dom.btnLoopMode.addEventListener('click', () => {
        if (appState.loopMode === 'loop') {
          appState.loopMode = 'rock';
          appState.direction = 1;
          dom.loopLabel.textContent = '往返 (ROCK)';
        } else if (appState.loopMode === 'rock') {
          appState.loopMode = 'once';
          appState.direction = 1;
          dom.loopLabel.textContent = '單次 (ONCE)';
        } else {
          appState.loopMode = 'loop';
          appState.direction = 1;
          dom.loopLabel.textContent = '循環 (LOOP)';
        }
      });

      dom.btnResetView.addEventListener('click', () => {
        if (appState.component) appState.component.autoView(500);
      });

      dom.btnFocusInterface.addEventListener('click', toggleFocusInterface);

      dom.btnToggleRep.addEventListener('click', () => {
        dom.repModal.classList.toggle('hidden');
      });
      dom.btnCloseRep.addEventListener('click', () => {
        dom.repModal.classList.add('hidden');
      });

      dom.proteinStyleSelect.addEventListener('change', (e) => {
        appState.protStyle = e.target.value;
        applyAllRepresentations();
      });
      dom.proteinColorSelect.addEventListener('change', (e) => {
        appState.protColor = e.target.value;
        applyAllRepresentations();
      });
      dom.dnaStyleSelect.addEventListener('change', (e) => {
        appState.dnaStyle = e.target.value;
        applyAllRepresentations();
      });
      dom.dnaColorSelect.addEventListener('change', (e) => {
        appState.dnaColor = e.target.value;
        applyAllRepresentations();
      });

      dom.chkBaseLabels.addEventListener('change', (e) => {
        appState.showBaseLabels = e.target.checked;
        applyAllRepresentations();
      });

      window.addEventListener('keydown', (e) => {
        if (['INPUT', 'SELECT'].includes(e.target.tagName)) return;
        if (e.code === 'Space') {
          e.preventDefault();
          togglePlay();
        } else if (e.code === 'ArrowRight') {
          dom.btnNextFrame.click();
        } else if (e.code === 'ArrowLeft') {
          dom.btnPrevFrame.click();
        } else if (e.key === 'r' || e.key === 'R') {
          if (appState.component) appState.component.autoView(400);
        }
      });
    }

    window.addEventListener('load', () => {
      appState.stage = new NGL.Stage('viewport', {
        backgroundColor: '#0b0f19',
        cameraType: 'perspective',
        ambientColor: 0xffffff,
        ambientIntensity: 0.55,
        lightColor: 0xffffff,
        lightIntensity: 0.95,
        clipNear: 0,
        clipFar: 100,
        fogNear: 100,
        fogFar: 100,
        sampleLevel: 0
      });

      window.addEventListener('resize', () => {
        appState.stage.handleResize();
      });

      initEvents();
      scanFolderFiles();
    });
  </script>
</body>
</html>
