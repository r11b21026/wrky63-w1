<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WRKY63 與 DNA 結合展示</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide 圖示庫 -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- NGL Viewer WebGL 渲染引擎 -->
  <script src="https://cdn.jsdelivr.net/npm/ngl@2.0.0-dev.37/dist/ngl.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');

    :root {
      --vmd-bg: #0b0f19;
      --vmd-panel: rgba(18, 24, 38, 0.94);
      --vmd-border: rgba(56, 189, 248, 0.28);
      --vmd-cyan: #38bdf8;
    }

    html, body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--vmd-bg);
      color: #e2e8f0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      overflow: hidden;
      width: 100%;
      height: 100%;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    .font-mono-vmd {
      font-family: 'JetBrains Mono', monospace;
    }

    .vmd-panel {
      background: var(--vmd-panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--vmd-border);
      box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.55);
    }

    optgroup {
      background-color: #0f172a;
      color: #38bdf8;
      font-weight: bold;
    }

    option {
      background-color: #1e293b;
      color: #f1f5f9;
      font-weight: normal;
    }

    input[type=range] {
      accent-color: #38bdf8;
    }

    /* 手勢水平輕擺動畫 */
    @keyframes sway {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(6px); }
    }
    .animate-sway {
      animation: sway 1.4s ease-in-out infinite;
    }

    /* 解決 Android / iOS 底部虛擬按鍵與導覽列遮擋問題 */
    .bottom-safe-timeline {
      bottom: calc(48px + env(safe-area-inset-bottom, 0px));
    }

    @media (min-width: 640px) {
      .bottom-safe-timeline {
        bottom: 0.75rem; /* 電腦與平板維持原本 12px 距離 */
      }
    }
  </style>
</head>
<body class="w-screen h-screen relative bg-[#0b0f19]">

  <!-- 3D 渲染視窗 -->
  <div id="viewport" class="w-full h-full absolute inset-0 cursor-grab active:cursor-grabbing"></div>

  <!-- 極簡互動提示（播放開始時顯示，使用者觸碰或2.8秒後自動淡出） -->
  <div id="gesture-hint" class="absolute bottom-28 sm:bottom-20 left-1/2 -translate-x-1/2 z-30 pointer-events-none transition-all duration-700 opacity-0 translate-y-2 flex items-center space-x-2 bg-slate-950/85 backdrop-blur-md border border-cyan-400/40 px-3.5 py-1.5 rounded-full text-xs text-cyan-200 shadow-2xl">
    <i data-lucide="hand" class="w-4 h-4 text-cyan-400 animate-sway"></i>
    <span class="tracking-wide">按住拖曳視角 ｜ 滾輪或雙指縮放</span>
  </div>

  <!-- 讀取狀態遮罩 -->
  <div id="loading-overlay" class="absolute inset-0 z-50 bg-black/60 backdrop-blur-sm flex flex-col items-center justify-center transition-opacity duration-300 pointer-events-none">
    <div class="vmd-panel rounded-2xl p-6 flex flex-col items-center space-y-3 pointer-events-auto border border-cyan-500/40 shadow-2xl">
      <div class="w-10 h-10 border-4 border-cyan-500/30 border-t-cyan-400 rounded-full animate-spin"></div>
      <div class="font-mono-vmd text-sm text-cyan-300 font-bold tracking-wider" id="loading-text">載入分子結構中...</div>
      <div class="text-[12px] text-slate-400" id="loading-subtext">請稍候</div>
    </div>
  </div>

  <!-- 頂部資訊列與切換器 -->
  <header class="absolute top-2 left-2 right-2 sm:top-3 sm:left-4 sm:right-4 z-20 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
    
    <!-- 鹼基與鍵結顏色圖例 -->
    <div id="base-legend" class="absolute top-14 right-2 sm:right-4 z-20 vmd-panel rounded-xl px-2.5 py-1.5 sm:px-3 sm:py-2 flex flex-col space-y-1.5 pointer-events-auto border border-slate-700/60 shadow-lg text-[11px] font-mono-vmd bg-slate-950/85 backdrop-blur-md">
      <div class="text-[9px] sm:text-[10px] text-slate-400 font-bold tracking-wider border-b border-slate-700/50 pb-0.5 flex items-center justify-between">
        <span>DNA 鹼基顏色</span>
      </div>
      <div class="grid grid-cols-2 gap-x-2.5 gap-y-0.5">
        <div class="flex items-center space-x-1.5">
          <span class="w-2 h-2 rounded-full" style="background-color: #3859F2;"></span>
          <span class="text-slate-200">A <span class="text-[9px] text-slate-400">(腺嘌呤)</span></span>
        </div>
        <div class="flex items-center space-x-1.5">
          <span class="w-2 h-2 rounded-full" style="background-color: #EB4759;"></span>
          <span class="text-slate-200">T <span class="text-[9px] text-slate-400">(胸腺嘧啶)</span></span>
        </div>
        <div class="flex items-center space-x-1.5">
          <span class="w-2 h-2 rounded-full" style="background-color: #F29433;"></span>
          <span class="text-slate-200">C <span class="text-[9px] text-slate-400">(胞嘧啶)</span></span>
        </div>
        <div class="flex items-center space-x-1.5">
          <span class="w-2 h-2 rounded-full" style="background-color: #26CC40;"></span>
          <span class="text-slate-200">G <span class="text-[9px] text-slate-400">(鳥嘌呤)</span></span>
        </div>
      </div>
      
      <!-- 鍵結圖例 -->
      <div class="pt-1 border-t border-slate-700/50 flex flex-col space-y-1 text-[10px]">
        <div class="flex items-center space-x-1.5">
          <span class="w-2.5 h-0.5 bg-[#ec4899] inline-block rounded"></span>
          <span class="text-pink-300">鹽橋 (Salt Bridge)</span>
        </div>
        <div class="flex items-center space-x-1.5">
          <span class="w-2.5 h-0.5 bg-[#facc15] inline-block rounded"></span>
          <span class="text-yellow-300">氫鍵 (H-bond)</span>
        </div>
      </div>
    </div>
    
    <!-- 左側：標題與結構選單 -->
    <div class="vmd-panel rounded-xl px-2.5 py-1.5 sm:px-3 sm:py-2 flex items-center space-x-2 pointer-events-auto shadow-lg max-w-[calc(100%-120px)] sm:max-w-md">
      <div class="flex items-center space-x-1.5 border-r border-slate-700/80 pr-2 shrink-0">
        <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
        <span class="font-bold text-xs sm:text-sm tracking-wider text-cyan-400 truncate">3D 互動展示</span>
      </div>

      <div class="flex items-center space-x-1.5 min-w-0">
        <i data-lucide="folder" class="w-3.5 h-3.5 text-cyan-400 shrink-0"></i>
        <select id="file-selector" class="bg-slate-900 border border-cyan-500/40 text-cyan-200 text-xs rounded-lg px-2 py-1 focus:outline-none focus:border-cyan-400 w-full truncate cursor-pointer hover:bg-slate-800 transition">
          <option value="" disabled selected>搜尋 PDB 檔案中...</option>
        </select>
        <button id="btn-refresh-files" title="重新整理目錄" class="p-1 text-slate-400 hover:text-cyan-300 rounded hover:bg-slate-800 transition shrink-0">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>

    <!-- 右側：功能按鍵區 -->
    <div class="flex items-center space-x-1.5 pointer-events-auto shrink-0">
      <button id="btn-focus-interface" title="接觸區嚴謹氫鍵/鹽橋分析" class="vmd-panel hover:bg-cyan-950/60 border-cyan-400/50 text-cyan-300 px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-xl text-xs font-semibold flex items-center space-x-1 transition shadow-lg">
        <i data-lucide="focus" class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-cyan-400"></i>
        <span id="focus-btn-text">特寫</span>
      </button>

      <button id="btn-toggle-rep" title="樣式與配色" class="vmd-panel hover:bg-slate-800 text-slate-300 hover:text-cyan-300 p-1.5 sm:px-2.5 sm:py-2 rounded-xl text-xs font-medium flex items-center space-x-1 transition">
        <i data-lucide="palette" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
        <span class="hidden sm:inline">樣式</span>
      </button>

      <button id="btn-reset-view" title="重設整體視角 (R 鍵)" class="vmd-panel hover:bg-slate-800 text-slate-300 hover:text-white p-1.5 sm:px-2.5 sm:py-2 rounded-xl text-xs transition">
        <i data-lucide="maximize" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
      </button>
    </div>
  </header>

  <!-- 樣式設定面板 -->
  <div id="rep-modal" class="hidden absolute top-14 right-2 sm:right-4 z-30 w-80 max-w-[calc(100vw-1rem)] vmd-panel rounded-2xl p-3.5 sm:p-4 shadow-2xl transition-all">
    <div class="flex items-center justify-between pb-2.5 border-b border-slate-700/60 mb-2.5">
      <div class="flex items-center space-x-2">
        <i data-lucide="sliders" class="w-4 h-4 text-cyan-400"></i>
        <h3 class="text-xs sm:text-sm font-semibold text-slate-100">分子樣式設定</h3>
      </div>
      <button id="btn-close-rep" class="text-slate-400 hover:text-white">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- 蛋白質樣式與配色 -->
    <div class="mb-3 p-2.5 bg-slate-900/60 rounded-xl border border-slate-800">
      <div class="text-xs font-mono-vmd text-cyan-400 font-bold mb-1.5">蛋白質 (WRKY63)</div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">樣式</label>
          <select id="protein-style-select" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg px-2 py-1 focus:outline-none">
            <option value="cartoon" selected>Cartoon 卡通</option>
            <option value="tube">Tube 圓管骨架</option>
            <option value="licorice">Licorice 棒狀</option>
          </select>
        </div>
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">顏色</label>
          <select id="protein-color-select" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg px-2 py-1 focus:outline-none">
            <option value="pymol_ss" selected>二級結構（Helix 紅 / Sheet 黃 / Loop 綠）</option>
            <option value="element">Element CPK </option>
            <option value="residueindex">漸層彩虹 (Rainbow)</option>
            <option value="#38bdf8">青藍 (Cyan)</option>
            <option value="#ef4444">紅色 (Red)</option>
            <option value="#22c55e">綠色 (Green)</option>
            <option value="#eab308">黃色 (Yellow)</option>
          </select>
        </div>
        <div class="col-span-2">
          <label class="block text-[11px] text-slate-400 mb-1">二級結構判定</label>
          <select id="ss-mode-select" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg px-2 py-1 focus:outline-none">
            <option value="dssp" selected>重新計算 (Kabsch-Sander DSSP)</option>
            <option value="file">使用檔案原本判定</option>
          </select>
          <label class="flex items-center gap-1.5 mt-2 text-[11px] text-slate-300 cursor-pointer">
            <input type="checkbox" id="arrow-toggle" checked> β 股末端顯示箭頭
          </label>
        </div>
      </div>
    </div>

    <!-- DNA 樣式與配色 -->
    <div class="p-2.5 bg-slate-900/60 rounded-xl border border-slate-800">
      <div class="text-xs font-mono-vmd text-amber-400 font-bold mb-1.5">DNA (W-box)</div>
      <div class="grid grid-cols-2 gap-2 mb-2">
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">樣式</label>
          <select id="dna-style-select" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg px-2 py-1 focus:outline-none">
            <option value="vmd_ladder" selected>VMD 階梯柱狀</option>
            <option value="cartoon_pure">雙螺旋絲帶</option>
            <option value="licorice">Licorice 棒狀</option>
          </select>
        </div>
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">骨架顏色</label>
          <select id="dna-color-select" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg px-2 py-1 focus:outline-none">
            <option value="#7dd3fc" selected>水藍色 (Classic Cyan)</option>
            <option value="#cbd5e1">純淨銀白</option>
            <option value="element">Element CPK</option>
            <option value="#f97316">亮橘 (Orange)</option>
          </select>
        </div>
      </div>
      
      <!-- 鹼基標籤 -->
      <div class="flex items-center justify-between pt-1 border-t border-slate-800 text-[11px] text-slate-300">
        <span>顯示鹼基文字標籤</span>
        <input type="checkbox" id="chk-base-labels" class="rounded bg-slate-800 border-slate-700 text-cyan-500 focus:ring-0 cursor-pointer">
      </div>
    </div>
  </div>

  <!-- 底部播放控制器 -->
  <footer id="bottom-timeline" class="hidden absolute bottom-safe-timeline left-2 right-2 sm:left-6 sm:right-6 z-20 pointer-events-none flex-col items-center">
    <div class="vmd-panel w-full max-w-xl rounded-2xl p-2 sm:px-4 sm:py-2.5 shadow-2xl pointer-events-auto flex flex-col gap-1.5">
      <div class="flex items-center space-x-2.5 w-full">
        <span class="font-mono-vmd text-xs text-cyan-300 font-semibold w-7 text-right" id="slider-curr-frame">0</span>
        <input id="trajectory-slider" type="range" min="0" max="0" value="0" step="1" 
               class="flex-1 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer focus:outline-none" />
        <span class="font-mono-vmd text-xs text-slate-400 font-semibold w-7 text-left" id="slider-total-frame">0</span>
      </div>

      <div class="flex items-center justify-between w-full">
        <button id="btn-loop-mode" class="px-2 py-0.5 rounded-lg text-[10px] sm:text-[11px] font-mono-vmd font-semibold bg-slate-900 border border-slate-700 text-cyan-400 hover:text-white transition flex items-center space-x-1">
          <i data-lucide="repeat" class="w-3 h-3"></i>
          <span id="loop-label">循環</span>
        </button>

        <div class="flex items-center space-x-1">
          <button id="btn-first-frame" class="p-1 sm:p-1.5 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition">
            <i data-lucide="skip-back" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
          </button>
          <button id="btn-prev-frame" class="p-1 sm:p-1.5 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition">
            <i data-lucide="step-back" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
          </button>
          <button id="btn-play" class="p-1.5 sm:p-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold transition shadow-lg shadow-cyan-500/20 active:scale-95 mx-1">
            <i id="play-icon" data-lucide="pause" class="w-4 h-4 sm:w-5 sm:h-5 fill-current"></i>
          </button>
          <button id="btn-next-frame" class="p-1 sm:p-1.5 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition">
            <i data-lucide="step-forward" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
          </button>
          <button id="btn-last-frame" class="p-1 sm:p-1.5 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition">
            <i data-lucide="skip-forward" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
          </button>
        </div>

        <div class="flex items-center font-mono-vmd text-xs">
          <span class="text-cyan-400 font-bold bg-slate-900/90 px-2 py-0.5 rounded-lg border border-cyan-500/30 text-[11px]" id="time-ns-display">
            0.0 ns
          </span>
        </div>
      </div>
    </div>
  </footer>

  <script>
    const AA_MAP = {
      'ALA': 'A', 'ARG': 'R', 'ASN': 'N', 'ASP': 'D', 'CYS': 'C', 'CYM': 'C', 'CYX': 'C',
      'GLN': 'Q', 'GLU': 'E', 'GLY': 'G', 'HIS': 'H', 'HID': 'H', 'HIE': 'H', 'HIP': 'H',
      'ILE': 'I', 'LEU': 'L', 'LYS': 'K', 'MET': 'M', 'PHE': 'F', 'PRO': 'P', 'SER': 'S',
      'THR': 'T', 'TRP': 'W', 'TYR': 'Y', 'VAL': 'V'
    };

    // 基準學術編號設定[cite: 1]
    const STANDARD_ANCHOR_W = 108;            // WRKYGQK 的 W 在標準序列中是 108[cite: 1]
    const TARGET_DISPLAY_RESNOS = [114, 117, 118]; // 自訂欲追蹤展示的標準殘基清單[cite: 1]

    const FIXED_TOTAL_NS = 100.0;

    const appState = {
      stage: null,
      component: null,
      trajectory: null,
      totalFrames: 1,
      currentFrame: 0,
      totalNs: FIXED_TOTAL_NS,
      isPlaying: false,
      loopMode: 'loop',
      direction: 1,
      timerId: null,
      fps: 20,
      protStyle: 'cartoon',
      protColor: 'pymol_ss',
      ssMode: 'dssp',
      arrowsOn: true,
      origSS: null,
      ssSchemeIds: null,
      strandT: new Map(),
      dnaStyle: 'vmd_ladder',
      dnaColor: '#7dd3fc', // 預設水藍色骨架[cite: 1]
      showBaseLabels: false,
      isFocusingInterface: false,
      dnaStrandSelections: [],
      dnaRungStubs: [],
      ladderShapeComp: null,
      focusLabelsShapeComp: null,
      
      focusTargetResnosInPdb: [],
      focusLabelsData: [],
      contactProtSele: '',
      contactDnaSele: '',
      focusViewSele: '',
      interactionPairs: {
        saltBridge: [],
        hbond: []
      },
      
      zincAtomIndex: -1,
      isLoadingFile: false,
      hasShownHint: false
    };

    lucide.createIcons();

    const dom = {
      viewport: document.getElementById('viewport'),
      gestureHint: document.getElementById('gesture-hint'),
      loadingOverlay: document.getElementById('loading-overlay'),
      loadingText: document.getElementById('loading-text'),
      loadingSubtext: document.getElementById('loading-subtext'),
      fileSelector: document.getElementById('file-selector'),
      btnRefreshFiles: document.getElementById('btn-refresh-files'),
      bottomTimeline: document.getElementById('bottom-timeline'),
      slider: document.getElementById('trajectory-slider'),
      sliderCurr: document.getElementById('slider-curr-frame'),
      sliderTotal: document.getElementById('slider-total-frame'),
      timeNsDisplay: document.getElementById('time-ns-display'),
      btnPlay: document.getElementById('btn-play'),
      btnPrevFrame: document.getElementById('btn-prev-frame'),
      btnNextFrame: document.getElementById('btn-next-frame'),
      btnFirstFrame: document.getElementById('btn-first-frame'),
      btnLastFrame: document.getElementById('btn-last-frame'),
      btnLoopMode: document.getElementById('btn-loop-mode'),
      loopLabel: document.getElementById('loop-label'),
      proteinStyleSelect: document.getElementById('protein-style-select'),
      proteinColorSelect: document.getElementById('protein-color-select'),
      ssModeSelect: document.getElementById('ss-mode-select'),
      arrowToggle: document.getElementById('arrow-toggle'),
      dnaStyleSelect: document.getElementById('dna-style-select'),
      dnaColorSelect: document.getElementById('dna-color-select'),
      chkBaseLabels: document.getElementById('chk-base-labels'),
      btnResetView: document.getElementById('btn-reset-view'),
      btnFocusInterface: document.getElementById('btn-focus-interface'),
      focusBtnText: document.getElementById('focus-btn-text'),
      btnToggleRep: document.getElementById('btn-toggle-rep'),
      repModal: document.getElementById('rep-modal'),
      btnCloseRep: document.getElementById('btn-close-rep')
    };

    function showLoading(title, sub = '') {
      dom.loadingText.textContent = title;
      dom.loadingSubtext.textContent = sub;
      dom.loadingOverlay.classList.remove('opacity-0', 'pointer-events-none');
    }

    function hideLoading() {
      dom.loadingOverlay.classList.add('opacity-0', 'pointer-events-none');
    }

    // 輕量手勢操作提示（顯示2.8秒或點擊後自動淡出）
    function showGestureHintOnce() {
      if (appState.hasShownHint || !dom.gestureHint) return;
      appState.hasShownHint = true;

      // 顯示
      dom.gestureHint.classList.remove('opacity-0', 'translate-y-2');
      dom.gestureHint.classList.add('opacity-100', 'translate-y-0');

      let timer = null;
      const dismiss = () => {
        if (timer) clearTimeout(timer);
        dom.gestureHint.classList.remove('opacity-100', 'translate-y-0');
        dom.gestureHint.classList.add('opacity-0', 'translate-y-2');
        window.removeEventListener('pointerdown', dismiss);
      };

      window.addEventListener('pointerdown', dismiss);
      timer = setTimeout(dismiss, 2800);
    }

    // 簡潔白話顯示檔名，並過濾掉技術性字眼
    function formatSimpleFileName(rawName) {
      return rawName.replace(/\.pdb$/i, '').replace(/[-_]/g, ' ');
    }

    // 判斷是否為靜態結構 (能量最小化) 或 MD 軌跡
    function isStaticPdb(name) {
      const lower = name.toLowerCase();
      if (/min|em|minimize|dock|complex|model|static/i.test(lower)) return true;
      if (/traj|md|movie|sim|prod|run|dcd/i.test(lower)) return false;
      return true; // 預設視為靜態
    }

    async function scanFolderFiles() {
      if (appState.isLoadingFile) return;

      const urlParams = new URLSearchParams(window.location.search);
      const specifiedFile = urlParams.get('file') || urlParams.get('pdb');
      if (specifiedFile) {
        dom.fileSelector.innerHTML = `<option value="${specifiedFile}">${formatSimpleFileName(specifiedFile)}</option>`;
        loadPdbFile(specifiedFile);
        return;
      }

      showLoading('搜尋 PDB 檔案中...', '請稍候');
      let found = [];

      const hostname = window.location.hostname;
      const pathname = window.location.pathname.replace(/^\/|\/$/g, '');
      const isGitHubPages = hostname.endsWith('github.io');

      if (isGitHubPages && pathname) {
        const owner = hostname.split('.')[0];
        const repo = pathname.split('/')[0];
        try {
          const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents`);
          if (res.ok) {
            const data = await res.json();
            found = data
              .filter(item => item.type === 'file' && item.name.toLowerCase().endsWith('.pdb'))
              .map(item => ({ name: item.name, url: item.name }));
          }
        } catch (e) {}
      }

      dom.fileSelector.innerHTML = '';
      if (found.length > 0) {
        const staticGroup = document.createElement('optgroup');
        staticGroup.label = '靜態結構 (能量最小化)';

        const trajGroup = document.createElement('optgroup');
        trajGroup.label = '分子動態影片 (MD 模擬軌跡)';

        let firstUrl = found[0].url;

        found.forEach(f => {
          const opt = document.createElement('option');
          opt.value = f.url;
          opt.textContent = formatSimpleFileName(f.name);
          if (isStaticPdb(f.name)) {
            staticGroup.appendChild(opt);
          } else {
            trajGroup.appendChild(opt);
          }
        });

        if (staticGroup.children.length > 0) dom.fileSelector.appendChild(staticGroup);
        if (trajGroup.children.length > 0) dom.fileSelector.appendChild(trajGroup);

        hideLoading();
        loadPdbFile(firstUrl);
      } else {
        dom.fileSelector.innerHTML = '<option value="" disabled selected>未偵測到 PDB 檔案 (請加 ?file=檔名.pdb)</option>';
        hideLoading();
      }
    }

    function getColorParams(colorVal) {
      if (!colorVal) return { color: '#7dd3fc' };
      if (colorVal.startsWith('#')) return { color: colorVal };
      if (appState.ssSchemeIds && appState.ssSchemeIds[colorVal]) return { colorScheme: appState.ssSchemeIds[colorVal] };
      return { colorScheme: colorVal };
    }

    // 註冊自訂配色方案
    function registerCustomColorSchemes() {
      const rgb = c => [(c >> 16) & 255, (c >> 8) & 255, c & 255];
      const toInt = v => (Math.round(v[0]) << 16) | (Math.round(v[1]) << 8) | Math.round(v[2]);

      // 1. PyMOL 二級結構配色 (螺旋紅/摺疊黃/Loop 綠)[cite: 1]
      const makeSS = (helix, sheet, loop) => {
        const light = rgb(sheet).map(v => v + (255 - v) * 0.65);
        const dark = rgb(sheet).map(v => v * 0.78);
        return function () {
          this.atomColor = function (atom) {
            const ss = atom.sstruc;
            if (ss === 'h' || ss === 'g' || ss === 'i') return helix;
            if (ss === 'e' || ss === 'b') {
              const t = appState.arrowsOn ? undefined : appState.strandT.get(atom.residueIndex);
              if (t === undefined) return sheet;
              return toInt(light.map((l, k) => l + (dark[k] - l) * t));
            }
            return loop;
          };
        };
      };

      appState.ssSchemeIds = {
        pymol_ss: NGL.ColormakerRegistry.addScheme(makeSS(0xFF0000, 0xFFFF00, 0x00E000), 'pymol_ss'),
      };
    }

    function computeStrandEnds() {
      const st = appState.component.structure;
      const map = new Map();
      let run = [];
      let prevChain = -1, prevIdx = -2;
      const flush = () => {
        if (run.length >= 2) run.forEach((idx, k) => map.set(idx, k / (run.length - 1)));
        run = [];
      };
      st.eachResidue(r => {
        if (!r.isProtein()) return;
        const isE = (r.sstruc === 'e' || r.sstruc === 'b');
        const cont = r.chainIndex === prevChain && r.index === prevIdx + 1;
        if (!isE || !cont) flush();
        if (isE) run.push(r.index);
        prevChain = r.chainIndex; prevIdx = r.index;
      });
      flush();
      appState.strandT = map;
    }

    function installArrowPatch() {
      try {
        const Cart = NGL.RepresentationRegistry.get('cartoon');
        if (!Cart || Cart.prototype.__arrowPatched) return;
        const origGetSpline = Cart.prototype.getSpline;
        Cart.prototype.getSpline = function (polymer) {
          const spline = origGetSpline.call(this, polymer);
          const origSize = spline.getSubdividedSize;
          spline.getSubdividedSize = function (params) {
            const out = origSize.call(this, params);
            if (!appState.arrowsOn || !polymer.isProtein()) return out;
            try {
              const size = out.size, m = this.subdiv, n = polymer.residueCount;
              const st = polymer.structure, rp = st.getResidueProxy();
              const HEAD = 1.8;
              let runStart = -1;
              for (let r = 0; r <= n; r++) {
                let isE = false;
                if (r < n) { rp.index = polymer.residueIndexStart + r; isE = (rp.sstruc === 'e' || rp.sstruc === 'b'); }
                if (isE) { if (runStart < 0) runStart = r; continue; }
                if (runStart >= 0) {
                  const b = r - 1;
                  if (b - runStart >= 1) {
                    const i0 = (b - 1) * m + Math.floor(m / 2);
                    const i1 = Math.min(size.length - 1, b * m + Math.floor(m / 2));
                    const S = size[b * m] * HEAD;
                    const tipRef = (b + 1) * m < size.length ? size[Math.min(size.length - 1, (b + 1) * m)] : size[b * m] * 0.1;
                    const tip = Math.min(tipRef, S * 0.3);
                    for (let i = i0; i <= i1; i++) size[i] = S + (tip - S) * ((i - i0) / Math.max(1, i1 - i0));
                  }
                  runStart = -1;
                }
              }
            } catch (e) { console.warn('箭頭修補失敗', e); }
            return out;
          };
          return spline;
        };
        Cart.prototype.__arrowPatched = true;
      } catch (e) { console.warn('無法安裝箭頭修補', e); }
    }

    function computeDSSP(structure) {
      const R = [];
      structure.eachResidue(r => {
        if (!r.isProtein()) return;
        const at = {};
        r.eachAtom(a => {
          const n = a.atomname.trim();
          if (n === 'N' || n === 'CA' || n === 'C' || n === 'O') at[n] = [a.x, a.y, a.z];
        });
        if (at.N && at.CA && at.C && at.O) {
          R.push({ index: r.index, chain: r.chainIndex, pro: (r.resname || '').trim().toUpperCase() === 'PRO', ...at });
        }
      });
      const n = R.length;
      const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);

      const link = new Array(n).fill(false);
      for (let i = 0; i < n - 1; i++) {
        link[i] = R[i].chain === R[i + 1].chain && dist(R[i].C, R[i + 1].N) < 2.5;
      }
      const contiguous = (a, b) => {
        if (a < 0 || b >= n) return false;
        for (let k = a; k < b; k++) if (!link[k]) return false;
        return true;
      };

      for (let i = 1; i < n; i++) {
        if (!link[i - 1] || R[i].pro) continue;
        const c = R[i - 1].C, o = R[i - 1].O;
        const dx = c[0] - o[0], dy = c[1] - o[1], dz = c[2] - o[2];
        const l = Math.hypot(dx, dy, dz) || 1;
        R[i].H = [R[i].N[0] + dx / l, R[i].N[1] + dy / l, R[i].N[2] + dz / l];
      }

      const acc = Array.from({ length: n }, () => new Set());
      for (let d = 0; d < n; d++) {
        if (!R[d].H) continue;
        for (let a = 0; a < n; a++) {
          if (Math.abs(a - d) < 2) continue;
          if (dist(R[d].CA, R[a].CA) > 9.0) continue;
          const rON = dist(R[a].O, R[d].N), rCH = dist(R[a].C, R[d].H);
          const rOH = dist(R[a].O, R[d].H), rCN = dist(R[a].C, R[d].N);
          const E = 0.084 * 332 * (1 / rON + 1 / rCH - 1 / rOH - 1 / rCN);
          if (E < -0.5) acc[d].add(a);
        }
      }
      const hb = (a, d) => a >= 0 && d >= 0 && a < n && d < n && acc[d].has(a);

      const ss = new Array(n).fill('c');

      const markHelix = (turn, ch) => {
        const t = new Array(n).fill(false);
        for (let i = 0; i + turn < n; i++) t[i] = contiguous(i, i + turn) && hb(i, i + turn);
        for (let i = 1; i + turn < n; i++) {
          if (t[i - 1] && t[i]) for (let k = i; k < i + turn; k++) ss[k] = ch;
        }
      };
      markHelix(5, 'i');
      markHelix(3, 'g');

      const E = new Array(n).fill(false);
      const bridges = [];
      for (let i = 1; i < n - 1; i++) {
        if (!contiguous(i - 1, i + 1)) continue;
        for (let j = i + 3; j < n - 1; j++) {
          if (!contiguous(j - 1, j + 1)) continue;
          if (dist(R[i].CA, R[j].CA) > 8.0) continue;
          const par = (hb(i - 1, j) && hb(j, i + 1)) || (hb(j - 1, i) && hb(i, j + 1));
          const anti = (hb(i, j) && hb(j, i)) || (hb(i - 1, j + 1) && hb(j - 1, i + 1));
          if (par) bridges.push([i, j, 'p']);
          if (anti) bridges.push([i, j, 'a']);
        }
      }
      const bset = new Set(bridges.map(b => b.join(',')));
      bridges.forEach(([i, j, t]) => {
        const nj = t === 'p' ? j + 1 : j - 1;
        if (bset.has([i + 1, nj, t].join(',')) || bset.has([i - 1, t === 'p' ? j - 1 : j + 1, t].join(','))) {
          E[i] = E[j] = true;
        }
      });
      for (let i = 1; i < n - 1; i++) if (!E[i] && E[i - 1] && E[i + 1] && link[i - 1] && link[i]) E[i] = true;
      for (let i = 0; i < n; i++) if (E[i]) ss[i] = 'e';

      markHelix(4, 'h');

      const tri = ss.map(c => (c === 'h' || c === 'g' || c === 'i') ? 'h' : (c === 'e' ? 'e' : 'c'));
      const minLen = { h: 4, e: 2 };
      for (let i = 0; i < n;) {
        let j = i;
        while (j < n && tri[j] === tri[i] && (j === i || link[j - 1])) j++;
        if (tri[i] !== 'c' && (j - i) < minLen[tri[i]]) for (let k = i; k < j; k++) tri[k] = 'c';
        i = j;
      }
      return R.map((r, k) => ({ index: r.index, ss: tri[k] }));
    }

    function applySecondaryStructure() {
      if (!appState.component) return;
      const st = appState.component.structure;
      const store = st.residueStore;
      if (!store || !store.sstruc) return;
      if (!appState.origSS) appState.origSS = new Uint8Array(store.sstruc);
      if (appState.ssMode === 'file') {
        store.sstruc.set(appState.origSS);
        computeStrandEnds();
        return;
      }
      try {
        const result = computeDSSP(st);
        st.eachResidue(r => { if (r.isProtein()) store.sstruc[r.index] = 'c'.charCodeAt(0); });
        result.forEach(({ index, ss }) => { store.sstruc[index] = ss.charCodeAt(0); });
      } catch (e) {
        store.sstruc.set(appState.origSS);
      }
      computeStrandEnds();
    }

    function calcAngleDeg(pA, pB, pC) {
      const v1 = [pA[0] - pB[0], pA[1] - pB[1], pA[2] - pB[2]];
      const v2 = [pC[0] - pB[0], pC[1] - pB[1], pC[2] - pB[2]];
      const l1 = Math.hypot(v1[0], v1[1], v1[2]);
      const l2 = Math.hypot(v2[0], v2[1], v2[2]);
      if (l1 === 0 || l2 === 0) return 0;
      let dot = (v1[0] * v2[0] + v1[1] * v2[1] + v1[2] * v2[2]) / (l1 * l2);
      dot = Math.max(-1.0, Math.min(1.0, dot));
      return Math.acos(dot) * (180.0 / Math.PI);
    }

    /**
     * 動態全接觸分析（幾何角度真氫鍵與鹽橋判斷）
     */
    function analyzeStructureDynamically(structure) {
      const nucleicResList = [];
      const nucleicAtoms = [];
      const dnaResidueMap = new Map();
      let zincIdx = -1;

      // 1. 蒐集核酸原子與鋅離子
      structure.eachResidue(r => {
        const rname = (r.resname || '').trim().toUpperCase();
        if (rname === 'ZN' || rname === 'ZN2' || rname === 'ZINC') {
          r.eachAtom(a => { zincIdx = a.index; });
          return;
        }

        const isDna = r.isNucleic() || /^(D[ATCG][35]?|[ATCG][35]?)$/.test(rname);
        if (isDna) {
          let o3 = null, p = null, backboneAtom = null, baseRing = null;
          const atomMap = {};

          r.eachAtom(a => {
            const aname = a.atomname.trim();
            atomMap[aname] = { index: a.index, x: a.x, y: a.y, z: a.z, element: a.element };
            if (a.element !== 'H') {
              nucleicAtoms.push({
                index: a.index,
                atomname: aname,
                element: a.element,
                resno: a.resno,
                resname: rname,
                x: a.x, y: a.y, z: a.z
              });
            }
            if (aname === "O3'" || aname === "O3*") o3 = { x: a.x, y: a.y, z: a.z };
            if (aname === "P") {
              p = { x: a.x, y: a.y, z: a.z };
              backboneAtom = a.index;
            }
            if (!backboneAtom && (aname === "C4'" || aname === "C3'" || aname === "C1'")) backboneAtom = a.index;
            if (aname === "N1" || aname === "N3" || aname === "C4") {
              if (!baseRing || aname === "N1" || aname === "N3") baseRing = a.index;
            }
          });

          if (!backboneAtom) r.eachAtom(a => { if (!backboneAtom) backboneAtom = a.index; });
          if (!baseRing) baseRing = backboneAtom;

          dnaResidueMap.set(r.resno, { resno: r.resno, resname: rname, atoms: atomMap });

          nucleicResList.push({
            resno: r.resno,
            chain: (r.chainname || 'A').trim(),
            resname: rname,
            o3: o3, p: p,
            c1Index: backboneAtom,
            ringIndex: baseRing
          });
        }
      });

      appState.zincAtomIndex = zincIdx;

      // DNA 階梯分股處理
      if (nucleicResList.length > 0) {
        const strandGroups = [];
        let curGroup = [nucleicResList[0]];

        for (let i = 0; i < nucleicResList.length - 1; i++) {
          const r1 = nucleicResList[i];
          const r2 = nucleicResList[i + 1];
          let dist = 999;
          if (r1.o3 && r2.p) {
            const dx = r1.o3.x - r2.p.x, dy = r1.o3.y - r2.p.y, dz = r1.o3.z - r2.p.z;
            dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
          }
          if (dist > 4.5 || r1.resname.endsWith('3') || r2.resname.endsWith('5')) {
            strandGroups.push(curGroup);
            curGroup = [r2];
          } else {
            curGroup.push(r2);
          }
        }
        if (curGroup.length > 0) strandGroups.push(curGroup);

        appState.dnaStrandSelections = strandGroups.map(grp => {
          const minR = grp[0].resno;
          const maxR = grp[grp.length - 1].resno;
          return `(${minR}-${maxR} and not protein and not hydrogen)`;
        });

        appState.dnaRungStubs = nucleicResList.map(item => ({
          anchor: item.c1Index,
          target: item.ringIndex,
          resname: item.resname,
          resno: item.resno
        }));
      }

      // 2. 蛋白質序列對齊 W=108 計算 offset[cite: 1]
      const protResList = [];
      const protResidueMap = new Map();

      structure.eachResidue(r => {
        if (r.isProtein()) {
          const rn = (r.resname || '').trim().toUpperCase();
          const atomMap = {};
          r.eachAtom(a => {
            atomMap[a.atomname.trim()] = { index: a.index, x: a.x, y: a.y, z: a.z, element: a.element };
          });
          protResidueMap.set(r.resno, { resno: r.resno, resname: rn, atoms: atomMap, index: r.index });
          protResList.push({ resno: r.resno, resname: rn, code: AA_MAP[rn] || 'X', index: r.index });
        }
      });

      const seqStr = protResList.map(x => x.code).join('');
      const motifIdx = seqStr.indexOf('WRKYGQK');

      let deltaOffset = 0;
      if (motifIdx !== -1) {
        const wInPdb = protResList[motifIdx].resno;
        deltaOffset = STANDARD_ANCHOR_W - wInPdb;
      } else {
        const sampleW = protResList.find(r => r.code === 'W');
        if (sampleW) deltaOffset = STANDARD_ANCHOR_W - sampleW.resno;
      }

      // 3. 取得目標殘基[cite: 1]
      const targetPdbResnos = [];
      const labelsData = [];
      const targetResnoSet = new Set();

      TARGET_DISPLAY_RESNOS.forEach(stdNo => {
        const actualResnoInPdb = stdNo - deltaOffset;
        targetPdbResnos.push(actualResnoInPdb);
        targetResnoSet.add(actualResnoInPdb);

        const matchRes = protResList.find(r => r.resno === actualResnoInPdb);
        const resCode3 = matchRes ? (matchRes.resname[0] + matchRes.resname.slice(1).toLowerCase()) : 'Res';
        const displayLabel = `${resCode3}${stdNo}`;

        const resData = protResidueMap.get(actualResnoInPdb);
        if (resData && resData.atoms['CA']) {
          labelsData.push({
            text: displayLabel,
            atomIndex: resData.atoms['CA'].index
          });
        }
      });

      appState.focusTargetResnosInPdb = targetPdbResnos;
      appState.focusLabelsData = labelsData;

      // 4. 一視同仁：遍歷目標殘基與 DNA 所有原子進行幾何判斷 (鹽橋 + 幾何角度氫鍵)
      const contactedDnaResnos = new Set();
      const saltBridges = [];
      const hbonds = [];

      targetPdbResnos.forEach(pResno => {
        const pRes = protResidueMap.get(pResno);
        if (!pRes) return;
        const pAtoms = pRes.atoms;

        dnaResidueMap.forEach(dRes => {
          const dAtoms = dRes.atoms;

          // A. 鹽橋判定：Lys NZ / Arg NH1,NH2,NE 與 磷酸基 OP1, OP2 (距離 <= 4.0 Å)
          const posNitrogens = ['NZ', 'NH1', 'NH2', 'NE'];
          const phosOxygens = ['OP1', 'OP2', 'O1P', 'O2P'];
          posNitrogens.forEach(pn => {
            if (pAtoms[pn]) {
              phosOxygens.forEach(po => {
                if (dAtoms[po]) {
                  const d2 = Math.hypot(pAtoms[pn].x - dAtoms[po].x, pAtoms[pn].y - dAtoms[po].y, pAtoms[pn].z - dAtoms[po].z);
                  if (d2 <= 4.0) {
                    contactedDnaResnos.add(dRes.resno);
                    saltBridges.push([pAtoms[pn].index, dAtoms[po].index]);
                  }
                }
              });
            }
          });

          // B. 氫鍵判定 (兼顧立體化學嚴謹性與側鏈旋轉自由度)
          // 情況 1：蛋白質為供體 (Protein Donor: N/O -> DNA Acceptor: O/N)
          Object.keys(pAtoms).forEach(pName => {
            const pAtom = pAtoms[pName];
            if (pAtom.element !== 'N' && pAtom.element !== 'O') return;

            const isFlexibleDonor = ['NZ', 'NH1', 'NH2', 'NE'].includes(pName);

            let virtualH = null;
            if (pAtoms['H']) {
              virtualH = [pAtoms['H'].x, pAtoms['H'].y, pAtoms['H'].z];
            } else if (pName === 'N' && pAtoms['CA']) {
              const vx = pAtom.x - pAtoms['CA'].x, vy = pAtom.y - pAtoms['CA'].y, vz = pAtom.z - pAtoms['CA'].z;
              const vl = Math.hypot(vx, vy, vz) || 1;
              virtualH = [pAtom.x + (vx / vl) * 1.0, pAtom.y + (vy / vl) * 1.0, pAtom.z + (vz / vl) * 1.0];
            } else if (pName === 'OG' && pAtoms['CB']) {
              const vx = pAtom.x - pAtoms['CB'].x, vy = pAtom.y - pAtoms['CB'].y, vz = pAtom.z - pAtoms['CB'].z;
              const vl = Math.hypot(vx, vy, vz) || 1;
              virtualH = [pAtom.x + (vx / vl) * 0.96, pAtom.y + (vy / vl) * 0.96, pAtom.z + (vz / vl) * 0.96];
            }

            Object.keys(dAtoms).forEach(dName => {
              const dAtom = dAtoms[dName];
              if (dAtom.element !== 'O' && dAtom.element !== 'N') return;

              const distDA = Math.hypot(pAtom.x - dAtom.x, pAtom.y - dAtom.y, pAtom.z - dAtom.z);

              // 針對 Lys NZ / Arg 等多氫基團：距離 <= 3.5 Å 且受體不在 C-N 反方向
              if (isFlexibleDonor) {
                if (distDA <= 3.5) {
                  let isValidAngle = true;
                  const prevC = pAtoms['CE'] || pAtoms['CZ'] || pAtoms['CD'];
                  if (prevC) {
                    const coneAngle = calcAngleDeg([dAtom.x, dAtom.y, dAtom.z], [pAtom.x, pAtom.y, pAtom.z], [prevC.x, prevC.y, prevC.z]);
                    if (coneAngle < 80.0) isValidAngle = false;
                  }
                  if (isValidAngle) {
                    contactedDnaResnos.add(dRes.resno);
                    hbonds.push([pAtom.index, dAtom.index]);
                  }
                }
                return;
              }

              // 針對主鏈或剛性供體：檢查 D-H..A 夾角 >= 120°
              if (distDA <= 3.6) {
                if (virtualH) {
                  const distHA = Math.hypot(virtualH[0] - dAtom.x, virtualH[1] - dAtom.y, virtualH[2] - dAtom.z);
                  const angle = calcAngleDeg([pAtom.x, pAtom.y, pAtom.z], virtualH, [dAtom.x, dAtom.y, dAtom.z]);
                  if (angle >= 120.0 && distHA <= 2.6) {
                    contactedDnaResnos.add(dRes.resno);
                    hbonds.push([pAtom.index, dAtom.index]);
                  }
                } else if (distDA <= 3.2) {
                  contactedDnaResnos.add(dRes.resno);
                  hbonds.push([pAtom.index, dAtom.index]);
                }
              }
            });
          });

          // 情況 2：DNA 為供體 (DNA Base N-H -> Protein Acceptor: O/N)
          const dnaDonors = ['N1', 'N2', 'N3', 'N4', 'N6'];
          dnaDonors.forEach(dName => {
            const dAtom = dAtoms[dName];
            if (!dAtom) return;

            let adjC = dAtoms['C2'] || dAtoms['C4'] || dAtoms['C6'];
            let vH = null;
            if (adjC) {
              const vx = dAtom.x - adjC.x, vy = dAtom.y - adjC.y, vz = dAtom.z - adjC.z;
              const vl = Math.hypot(vx, vy, vz) || 1;
              vH = [dAtom.x + (vx / vl) * 1.0, dAtom.y + (vy / vl) * 1.0, dAtom.z + (vz / vl) * 1.0];
            }

            Object.keys(pAtoms).forEach(pName => {
              const pAtom = pAtoms[pName];
              if (pAtom.element !== 'O' && pAtom.element !== 'N') return;

              const distDA = Math.hypot(dAtom.x - pAtom.x, dAtom.y - pAtom.y, dAtom.z - pAtom.z);
              if (distDA <= 3.6) {
                if (vH) {
                  const distHA = Math.hypot(vH[0] - pAtom.x, vH[1] - pAtom.y, vH[2] - pAtom.z);
                  const angle = calcAngleDeg([dAtom.x, dAtom.y, dAtom.z], vH, [pAtom.x, pAtom.y, pAtom.z]);
                  if (angle >= 120.0 && distHA <= 2.6) {
                    contactedDnaResnos.add(dRes.resno);
                    hbonds.push([pAtom.index, dAtom.index]);
                  }
                } else if (distDA <= 3.2) {
                  contactedDnaResnos.add(dRes.resno);
                  hbonds.push([pAtom.index, dAtom.index]);
                }
              }
            });
          });
        });
      });

      appState.contactProtSele = targetPdbResnos.length > 0 
        ? `(${targetPdbResnos.join(' or ')}) and protein and not hydrogen` 
        : 'none';

      const dResArr = Array.from(contactedDnaResnos);
      if (dResArr.length > 0) {
        appState.contactDnaSele = `(${dResArr.join(' or ')}) and not protein and not hydrogen`;
      } else {
        appState.contactDnaSele = 'none';
      }

      appState.focusViewSele = [...targetPdbResnos, ...dResArr].length > 0
        ? [...targetPdbResnos, ...dResArr].join(' or ')
        : 'nucleic';

      appState.interactionPairs = {
        saltBridge: saltBridges,
        hbond: hbonds
      };
    }

    /**
     * 重繪所有 Representation
     */
    function applyAllRepresentations() {
      if (!appState.component) return;
      appState.component.removeAllRepresentations();

      if (appState.ladderShapeComp) {
        appState.stage.removeComponent(appState.ladderShapeComp);
        appState.ladderShapeComp = null;
      }
      if (appState.focusLabelsShapeComp) {
        appState.stage.removeComponent(appState.focusLabelsShapeComp);
        appState.focusLabelsShapeComp = null;
      }

      const pRep = appState.protStyle;
      const dRep = appState.dnaStyle;
      const pColorParams = getColorParams(appState.protColor);
      const dColorParams = getColorParams(appState.dnaColor);

      const bgOpacity = appState.isFocusingInterface ? 0.22 : 1.0;

      // 1. 蛋白質主體
      const protSele = 'protein and not hydrogen and not (_ZN or :ZN or [ZN] or zinc)';
      if (pRep === 'cartoon') {
        appState.component.addRepresentation('cartoon', {
          sele: protSele,
          ...pColorParams,
          opacity: bgOpacity,
          aspectRatio: 5,
          subdiv: 12,
          radialSegments: 20,
          capped: true,
          smoothSheet: true
        });
      } else if (pRep === 'tube') {
        appState.component.addRepresentation('tube', {
          sele: protSele,
          ...pColorParams,
          opacity: bgOpacity,
          radius: 0.28
        });
      } else if (pRep === 'licorice') {
        appState.component.addRepresentation('licorice', {
          sele: protSele,
          ...pColorParams,
          opacity: bgOpacity,
          radius: 0.2,
          multipleBond: 'off'
        });
      }
      
      // 2. DNA 骨架
      if (appState.dnaStrandSelections && appState.dnaStrandSelections.length > 0) {
        appState.dnaStrandSelections.forEach(strandSele => {
          if (dRep === 'vmd_ladder' || dRep === 'cartoon_pure') {
            appState.component.addRepresentation('cartoon', {
              sele: `${strandSele} and not protein and not (_ZN or :ZN or [ZN] or zinc)`,
              ...dColorParams,
              opacity: bgOpacity,
              radiusType: 'size',
              radiusSize: 0.6,
              aspectRatio: 4,
              tension: 0.3,
              smoothSheet: false,
              subdiv: 12
            });
          }
        });
      }

      // 3. DNA 階梯柱狀 (VMD Ladder)
      if (dRep === 'vmd_ladder') {
        if (appState.dnaRungStubs && appState.dnaRungStubs.length > 0) {
          const shape = new NGL.Shape("vmd_rungs");
          const structure = appState.component.structure;

          const baseColorPalette = {
            'A': [0.22, 0.35, 0.95],
            'T': [0.92, 0.28, 0.35],
            'C': [0.95, 0.58, 0.20],
            'G': [0.15, 0.80, 0.25],
            'U': [0.92, 0.28, 0.35]
          };

          const parseBaseColor = (rname) => {
            const clean = (rname || '').trim().toUpperCase().replace(/^D/, '').replace(/[35]$/, '');
            return baseColorPalette[clean] || [0.8, 0.84, 0.89];
          };

          const stubRadius = 0.46;

          appState.dnaRungStubs.forEach(stub => {
            const aBackbone = structure.getAtomProxy(stub.anchor);
            const aBase = structure.getAtomProxy(stub.target);

            if (aBackbone && aBase) {
              const color = parseBaseColor(stub.resname);
              const dx = aBase.x - aBackbone.x;
              const dy = aBase.y - aBackbone.y;
              const dz = aBase.z - aBackbone.z;
              const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

              if (dist > 0.8) {
                const ux = dx / dist, uy = dy / dist, uz = dz / dist;
                const startX = aBackbone.x + ux * 1.3;
                const startY = aBackbone.y + uy * 1.3;
                const startZ = aBackbone.z + uz * 1.3;

                shape.addCylinder([startX, startY, startZ], [aBase.x, aBase.y, aBase.z], color, stubRadius);
                shape.addSphere([aBase.x, aBase.y, aBase.z], color, stubRadius);
              }
            }
          });

          appState.ladderShapeComp = appState.stage.addComponentFromObject(shape);
          appState.ladderShapeComp.addRepresentation("buffer", {
            opacity: bgOpacity
          });
        }
      } else if (dRep === 'licorice') {
        appState.component.addRepresentation('licorice', {
          sele: 'nucleic and not protein and not hydrogen and not (_ZN or :ZN or [ZN] or zinc)',
          ...dColorParams,
          opacity: bgOpacity,
          radius: 0.22,
          multipleBond: 'off'
        });
      }

      // 4. 鋅離子 (ZN)
      const znSele = appState.zincAtomIndex >= 0 ? `@${appState.zincAtomIndex}` : '_ZN or :ZN or [ZN] or zinc';
      appState.component.addRepresentation('spacefill', {
        sele: znSele,
        color: '#94a3b8',
        opacity: bgOpacity,
        scale: 0.35
      });

      // 5. 鹼基標籤
      if (appState.showBaseLabels) {
        appState.component.addRepresentation('label', {
          sele: 'nucleic and not protein and not hydrogen and (.C1\' or .C1*)',
          labelType: 'resname',
          color: '#f8fafc',
          scale: 1.2,
          fontFamily: 'monospace'
        });
      }

      // 6. 接觸面特寫
      if (appState.isFocusingInterface) {
        if (appState.contactProtSele && appState.contactProtSele !== 'none') {
          appState.component.addRepresentation('licorice', {
            sele: appState.contactProtSele,
            colorScheme: 'element',
            radius: 0.24,
            opacity: 1.0,
            multipleBond: 'off'
          });

          if (appState.focusLabelsData && appState.focusLabelsData.length > 0) {
            const textShape = new NGL.Shape("focus_labels");
            const structure = appState.component.structure;

            appState.focusLabelsData.forEach(item => {
              const atomProxy = structure.getAtomProxy(item.atomIndex);
              if (atomProxy) {
                textShape.addText(
                  [atomProxy.x, atomProxy.y + 1.2, atomProxy.z],
                  [0.22, 0.74, 0.97],
                  1.5,
                  item.text
                );
              }
            });

            appState.focusLabelsShapeComp = appState.stage.addComponentFromObject(textShape);
            appState.focusLabelsShapeComp.addRepresentation("buffer");
          }
        }

        if (appState.contactDnaSele && appState.contactDnaSele !== 'none') {
          appState.component.addRepresentation('licorice', {
            sele: appState.contactDnaSele,
            colorScheme: 'element',
            radius: 0.22,
            opacity: 1.0,
            multipleBond: 'off'
          });
        }

        // 鹽橋 (洋紅色粗虛線 #ec4899)
        if (appState.interactionPairs.saltBridge.length > 0) {
          appState.component.addRepresentation('distance', {
            atomPair: appState.interactionPairs.saltBridge,
            color: '#ec4899',
            radius: 0.09,
            dashLength: 0.25,
            labelUnit: 'angstrom',
            labelColor: '#fbcfe8',
            labelSize: 1.3,
            labelBackground: true,
            labelBackgroundColor: '#0b0f19',
            labelBackgroundMargin: 0.1
          });
        }

        // 嚴謹氫鍵 (金黃色細虛線 #facc15)
        if (appState.interactionPairs.hbond.length > 0) {
          appState.component.addRepresentation('distance', {
            atomPair: appState.interactionPairs.hbond,
            color: '#facc15',
            radius: 0.07,
            dashLength: 0.2,
            labelUnit: 'angstrom',
            labelColor: '#fef08a',
            labelSize: 1.3,
            labelBackground: true,
            labelBackgroundColor: '#0b0f19',
            labelBackgroundMargin: 0.1
          });
        }
      }

      const legendEl = document.getElementById('base-legend');
      if (legendEl) {
        if (dRep === 'vmd_ladder') legendEl.classList.remove('hidden');
        else legendEl.classList.add('hidden');
      }
    }

    function toggleFocusInterface() {
      if (!appState.component) return;
      appState.isFocusingInterface = !appState.isFocusingInterface;

      analyzeStructureDynamically(appState.component.structure);
      applyAllRepresentations();

      if (appState.isFocusingInterface) {
        const viewTarget = appState.focusViewSele || 'not protein and not hydrogen';
        appState.component.autoView(viewTarget, 800);
        dom.btnFocusInterface.classList.add('bg-cyan-500/25', 'border-cyan-400');
        dom.focusBtnText.textContent = '重設視角';
      } else {
        appState.component.autoView(600);
        dom.btnFocusInterface.classList.remove('bg-cyan-500/25', 'border-cyan-400');
        dom.focusBtnText.textContent = '特寫';
      }
    }

    function updateTimeDisplay(frame) {
      if (appState.totalFrames <= 1) {
        dom.timeNsDisplay.textContent = '0.0 ns';
        return;
      }
      const currentNs = (frame / (appState.totalFrames - 1)) * FIXED_TOTAL_NS;
      dom.timeNsDisplay.textContent = `${currentNs.toFixed(1)} ns`;
    }

    function setFrame(targetFrame) {
      if (!appState.trajectory) return;
      const maxF = appState.totalFrames - 1;
      let f = Math.max(0, Math.min(targetFrame, maxF));

      appState.currentFrame = f;
      appState.trajectory.setFrame(f);

      dom.slider.value = f;
      dom.sliderCurr.textContent = f;
      updateTimeDisplay(f);

      if (appState.isFocusingInterface || appState.dnaStyle === 'vmd_ladder') {
        analyzeStructureDynamically(appState.component.structure);
        applyAllRepresentations();
      }
    }

    function stepFrame(step) {
      if (appState.totalFrames <= 1) return;
      let next = appState.currentFrame + step;
      const maxF = appState.totalFrames - 1;

      if (appState.loopMode === 'loop') {
        if (next > maxF) next = 0;
        if (next < 0) next = maxF;
      } else if (appState.loopMode === 'rock') {
        if (next > maxF) {
          appState.direction = -1;
          next = maxF - 1;
        } else if (next < 0) {
          appState.direction = 1;
          next = 1;
        }
      } else if (appState.loopMode === 'once') {
        if (next > maxF) {
          stopPlayback();
          setFrame(maxF);
          return;
        }
        if (next < 0) {
          stopPlayback();
          setFrame(0);
          return;
        }
      }

      setFrame(next);
    }

    function startPlayback() {
      if (appState.totalFrames <= 1) return;
      stopPlayback();
      appState.isPlaying = true;
      updatePlayIcon(true);

      const intervalMs = Math.round(1000 / appState.fps);
      appState.timerId = setInterval(() => {
        stepFrame(appState.direction);
      }, intervalMs);
    }

    function stopPlayback() {
      appState.isPlaying = false;
      if (appState.timerId) {
        clearInterval(appState.timerId);
        appState.timerId = null;
      }
      updatePlayIcon(false);
    }

    function togglePlay() {
      if (appState.isPlaying) stopPlayback();
      else startPlayback();
    }

    function updatePlayIcon(playing) {
      const icon = dom.btnPlay.querySelector('i');
      if (!icon) return;
      icon.setAttribute('data-lucide', playing ? 'pause' : 'play');
      lucide.createIcons();
    }

    async function loadPdbFile(url) {
      if (appState.isLoadingFile) return;
      appState.isLoadingFile = true;
      stopPlayback();
      showLoading('正在讀取結構...', url);

      dom.bottomTimeline.classList.add('hidden');
      dom.bottomTimeline.classList.remove('flex');

      try {
        appState.stage.removeAllComponents();

        const comp = await appState.stage.loadFile(url, {
          defaultRepresentation: false,
          asTrajectory: true
        });
        appState.component = comp;
        appState.origSS = null;

        comp.structure.eachResidue(r => {
          const rn = (r.resname || '').trim().toUpperCase();
          if (rn === 'CYM') r.resname = 'CYS';
          if (rn === 'HIE' || rn === 'HID' || rn === 'HIP') r.resname = 'HIS';
        });

        applySecondaryStructure();
        analyzeStructureDynamically(comp.structure);
        applyAllRepresentations();

        comp.autoView(500);

        const trajComp = comp.addTrajectory();
        const trajectory = trajComp.trajectory;
        appState.trajectory = trajectory;

        function evaluateTrajectory(count) {
          if (count > 1) {
            appState.totalFrames = count;
            dom.slider.max = count - 1;
            dom.sliderTotal.textContent = String(count - 1);
            dom.bottomTimeline.classList.remove('hidden');
            dom.bottomTimeline.classList.add('flex');
            setFrame(0);
            startPlayback();
            // 動態軌跡成功播映時，呈現極簡手勢操作提示（2.8秒後自動淡出）
            showGestureHintOnce();
          } else {
            appState.totalFrames = 1;
            appState.trajectory = null;
            dom.bottomTimeline.classList.add('hidden');
            dom.bottomTimeline.classList.remove('flex');
            stopPlayback();
            // 靜態結構同樣顯示一次手勢提示
            showGestureHintOnce();
          }
        }

        trajectory.signals.countChanged.add(function (count) {
          evaluateTrajectory(count);
        });

        const initCount = trajectory.frameCount || 1;
        evaluateTrajectory(initCount);

      } catch (err) {
        console.error('PDB 載入失敗:', err);
        dom.loadingText.textContent = '載入失敗: ' + url;
        dom.loadingSubtext.textContent = '請檢查檔案是否存在且可讀取';
        dom.loadingOverlay.classList.remove('opacity-0', 'pointer-events-none');
        setTimeout(hideLoading, 3000);
      } finally {
        hideLoading();
        appState.isLoadingFile = false;
      }
    }

    function initEvents() {
      dom.fileSelector.addEventListener('change', (e) => {
        loadPdbFile(e.target.value);
      });

      dom.btnRefreshFiles.addEventListener('click', scanFolderFiles);
      dom.btnPlay.addEventListener('click', togglePlay);

      dom.btnPrevFrame.addEventListener('click', () => {
        stopPlayback();
        stepFrame(-1);
      });

      dom.btnNextFrame.addEventListener('click', () => {
        stopPlayback();
        stepFrame(1);
      });

      dom.btnFirstFrame.addEventListener('click', () => {
        stopPlayback();
        setFrame(0);
      });

      dom.btnLastFrame.addEventListener('click', () => {
        stopPlayback();
        setFrame(appState.totalFrames - 1);
      });

      dom.slider.addEventListener('input', (e) => {
        stopPlayback();
        setFrame(parseInt(e.target.value, 10));
      });

      dom.btnLoopMode.addEventListener('click', () => {
        if (appState.loopMode === 'loop') {
          appState.loopMode = 'rock';
          appState.direction = 1;
          dom.loopLabel.textContent = '往返';
        } else if (appState.loopMode === 'rock') {
          appState.loopMode = 'once';
          appState.direction = 1;
          dom.loopLabel.textContent = '單次';
        } else {
          appState.loopMode = 'loop';
          appState.direction = 1;
          dom.loopLabel.textContent = '循環';
        }
      });

      dom.btnResetView.addEventListener('click', () => {
        if (appState.component) appState.component.autoView(500);
      });

      dom.btnFocusInterface.addEventListener('click', toggleFocusInterface);

      dom.btnToggleRep.addEventListener('click', () => {
        dom.repModal.classList.toggle('hidden');
        const legend = document.getElementById('base-legend');
        if (legend && appState.dnaStyle === 'vmd_ladder') {
          if (!dom.repModal.classList.contains('hidden')) legend.classList.add('hidden');
          else legend.classList.remove('hidden');
        }
      });

      dom.btnCloseRep.addEventListener('click', () => {
        dom.repModal.classList.add('hidden');
        const legend = document.getElementById('base-legend');
        if (legend && appState.dnaStyle === 'vmd_ladder') legend.classList.remove('hidden');
      });

      dom.proteinStyleSelect.addEventListener('change', (e) => {
        appState.protStyle = e.target.value;
        applyAllRepresentations();
      });
      dom.arrowToggle.addEventListener('change', (e) => {
        appState.arrowsOn = e.target.checked;
        applyAllRepresentations();
      });
      dom.ssModeSelect.addEventListener('change', (e) => {
        appState.ssMode = e.target.value;
        applySecondaryStructure();
        applyAllRepresentations();
      });
      dom.proteinColorSelect.addEventListener('change', (e) => {
        appState.protColor = e.target.value;
        applyAllRepresentations();
      });
      dom.dnaStyleSelect.addEventListener('change', (e) => {
        appState.dnaStyle = e.target.value;
        applyAllRepresentations();
      });
      dom.dnaColorSelect.addEventListener('change', (e) => {
        appState.dnaColor = e.target.value;
        applyAllRepresentations();
      });

      dom.chkBaseLabels.addEventListener('change', (e) => {
        appState.showBaseLabels = e.target.checked;
        applyAllRepresentations();
      });

      window.addEventListener('keydown', (e) => {
        if (['INPUT', 'SELECT'].includes(e.target.tagName)) return;
        if (e.code === 'Space') {
          e.preventDefault();
          togglePlay();
        } else if (e.code === 'ArrowRight') {
          dom.btnNextFrame.click();
        } else if (e.code === 'ArrowLeft') {
          dom.btnPrevFrame.click();
        } else if (e.key === 'r' || e.key === 'R') {
          if (appState.component) appState.component.autoView(400);
        }
      });
    }

    window.addEventListener('load', () => {
      registerCustomColorSchemes();
      installArrowPatch();
      appState.stage = new NGL.Stage('viewport', {
        backgroundColor: '#0b0f19',
        cameraType: 'perspective',
        ambientColor: 0xffffff,
        ambientIntensity: 0.55,
        lightColor: 0xffffff,
        lightIntensity: 0.95,
        clipNear: 0,
        clipFar: 100,
        fogNear: 100,
        fogFar: 100,
        sampleLevel: 0
      });

      window.addEventListener('resize', () => {
        appState.stage.handleResize();
      });

      initEvents();
      scanFolderFiles();
    });
  </script>
</body>
</html>
